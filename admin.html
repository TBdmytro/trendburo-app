<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="trendburo-build" content="2026-10-02-admin-v12">
<title>Trend Büro — Каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Prata&display=swap">
<style>
:root{
  --bg:#f6f6f7;--card:#fff;--fg:#1c1d20;--g2:#4d5058;--muted:#8b8e95;--line:#ebebee;--soft:#f1f1f3;--soft2:#e8e8eb;
  --side:#1c1d20;--side2:#26282c;--ink:#1c1d20;--ink-g:linear-gradient(180deg,#3a3d43,#232529 55%,#1a1b1e);
  --ok:#2e7d52;--ok-bg:#e6f3ec;--warn:#9a5f16;--warn-bg:#f8eedf;--err:#b3261e;--err-bg:#fbe7e5;
  --r:16px;--f:"Onest",-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Prata",Georgia,serif;
  --sh:0 1px 2px rgba(20,21,24,.04),0 6px 24px rgba(20,21,24,.05);
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Каркас ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100%;background:linear-gradient(90deg,var(--side) 248px,var(--bg) 248px)}
.side{background:var(--side);color:#fff;display:flex;flex-direction:column;padding:22px 14px 16px;position:sticky;top:0;height:100vh}
.logo{padding:4px 10px 22px}
.logo b{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.01em;display:block}
.logo span{font-size:11.5px;color:rgba(255,255,255,.5);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:rgba(255,255,255,.62);padding:10px 12px;border-radius:11px;text-align:left;font-weight:500;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current=page]{background:rgba(255,255,255,.1);color:#fff}
.nav .cnt{margin-left:auto;font-size:11.5px;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:99px}
.pump{margin-top:auto;background:var(--side2);border-radius:14px;padding:12px;font-size:12.5px;color:rgba(255,255,255,.75)}
.pump b{color:#fff;font-weight:600}
.pump .bar{margin-top:8px;background:rgba(255,255,255,.12)}
.pump .bar i{background:#fff}
.who{display:flex;align-items:center;gap:10px;padding:12px 8px 0;margin-top:12px;border-top:1px solid rgba(255,255,255,.08);font-size:13px;color:rgba(255,255,255,.7)}
.who .av{width:30px;height:30px;border-radius:50%;background:#3a3d43;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px}
.who button{margin-left:auto;border:0;background:none;color:rgba(255,255,255,.5);font-size:12.5px}
.who button:hover{color:#fff}
.main{min-width:0;padding:30px 36px 110px}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-size:28px;line-height:1.15;margin:0;letter-spacing:-.025em;font-weight:700}
.head p{margin:6px 0 0;color:var(--muted)}
.head .sp{flex:1}

/* ---------- Элементы ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:20px}
.sec{margin-top:30px}
.sec>h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.sec>h2 small{font-size:13px;color:var(--muted);font-weight:400}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;background:var(--ink-g);color:#fff;font-weight:600;white-space:nowrap;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.soft{background:var(--soft);color:var(--fg);font-weight:500}
.btn.soft:hover{background:var(--soft2)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg);font-weight:500}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.lg{padding:14px 22px;font-size:15px;border-radius:14px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--g2);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.err{background:var(--err-bg);color:var(--err)}.pill.dark{background:var(--ink);color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.run .dot{animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:#b9bbc1;box-shadow:0 0 0 3px rgba(28,29,32,.06)}
textarea{min-height:120px;resize:vertical;font-size:13px;line-height:1.55}
label.f{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--g2);font-weight:500}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.err{color:var(--err)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:10px;color:var(--g2);font-weight:500}
.seg button[aria-pressed=true]{background:#fff;color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.chip:hover{border-color:#c9cbd0}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .c{font-size:11.5px;opacity:.6}
.bar{height:6px;border-radius:3px;background:var(--soft2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .4s}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px}
.toggle input{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--soft2);position:relative;transition:background .2s;flex:none;cursor:pointer;margin:0}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.toggle input:checked{background:var(--ink)}
.toggle input:checked::after{transform:translateX(16px)}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.note-box{display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:var(--soft);font-size:13.5px;line-height:1.5}
.note-box.err{background:var(--err-bg);color:#5c1612}.note-box.warn{background:var(--warn-bg);color:#4d3009}.note-box.ok{background:var(--ok-bg);color:#123d25}
.note-box svg{margin-top:1px}

/* ---------- Обзор ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:18px 20px}
.stat span{color:var(--muted);font-size:13px}
.stat b{display:block;font-size:30px;letter-spacing:-.03em;margin-top:6px;font-weight:600}
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.brand{padding:20px;display:flex;flex-direction:column;gap:14px}
.wm{font-family:var(--serif);font-size:19px;letter-spacing:.14em;text-transform:uppercase;line-height:1.2}
.brand .meta{font-size:12.5px;color:var(--muted)}
.brand .nums{display:flex;gap:18px;font-size:13px;color:var(--g2)}
.brand .nums b{font-size:18px;color:var(--fg);display:block;font-weight:600}
.brand .acts{display:flex;gap:8px;margin-top:auto}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li:hover{background:#fafafb}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600}
.li .t span{font-size:12.5px;color:var(--muted)}
.li .pr{width:150px}

/* ---------- Мастер загрузки ---------- */
.steps{display:flex;flex-direction:column;gap:14px;max-width:920px}
.step{padding:22px}
.step h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:10px}
.step h3 i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:grid;place-items:center}
.step>.hint{margin:0 0 16px 34px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.pick button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:all .15s}
.pick button:hover{border-color:#c9cbd0}
.pick button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pick .wm{font-size:15px}
.pick small{color:var(--muted);font-size:12px}
.sub-g{display:flex;flex-direction:column;gap:14px;margin-left:34px}
.summary{display:flex;align-items:center;gap:16px;padding:20px 22px;flex-wrap:wrap}
.summary .t{flex:1;min-width:240px}
.summary .t b{display:block;font-size:15px}
.summary .t span{font-size:13px;color:var(--muted)}

/* ---------- Задача и предпросмотр ---------- */
.jhead{padding:22px;display:flex;flex-direction:column;gap:16px}
.jstats{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.jstats div{background:#fff;padding:12px 14px}
.jstats span{font-size:12px;color:var(--muted)}
.jstats b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin:22px 0 14px}
.tabs button{border:0;background:none;border-radius:99px;padding:8px 14px;font-weight:500;color:var(--g2);white-space:nowrap}
.tabs button:hover{background:var(--soft)}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.tabs .c{opacity:.6;margin-left:4px;font-size:12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pc{position:relative;display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.pc.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),var(--sh)}
.pc .ph{aspect-ratio:4/5;background:#f4f4f5;display:grid;place-items:center;position:relative}
.pc .ph img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.pc .ph .n{position:absolute;right:10px;bottom:10px;font-size:11px;background:rgba(255,255,255,.9);padding:2px 8px;border-radius:99px;color:var(--g2)}
.pc .ck{position:absolute;left:10px;top:10px;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.95);border:1px solid var(--line);display:grid;place-items:center;z-index:2}
.pc .ck input{width:16px;height:16px;margin:0;accent-color:#1c1d20;cursor:pointer}
.pc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .br{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pc .tt{font-weight:600;line-height:1.3}
.pc .sz{display:flex;gap:4px;flex-wrap:wrap}
.pc .sz span{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--g2)}
.pc .sz span.no{color:#bbb;text-decoration:line-through}
.pc .prc{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:6px}
.pc .prc b{font-size:16px}
.pc .prc s{color:var(--muted);font-size:12px;text-decoration:none}
.pc .iss{display:flex;gap:4px;flex-wrap:wrap}
.pc .iss .pill{font-size:11px;padding:2px 8px;font-weight:500}
.pc select{padding:7px 10px;font-size:12.5px}
.actbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:18px;padding:10px 10px 10px 20px;display:flex;align-items:center;gap:10px;z-index:30;box-shadow:0 12px 40px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.actbar .btn.soft{background:rgba(255,255,255,.12);color:#fff}
.actbar .btn.pub{background:#fff;color:var(--ink)}
.more{display:flex;justify-content:center;margin-top:18px}

/* ---------- Новый товар ---------- */
.addg{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.addf{padding:22px;display:flex;flex-direction:column;gap:20px}
.addf h3{margin:0;font-size:15px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{position:relative;aspect-ratio:4/5;border:1.5px dashed #d3d4d8;border-radius:14px;background:#fafafb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12.5px;cursor:pointer;overflow:hidden;transition:border-color .15s,background .15s}
.slot:hover,.slot.over{border-color:var(--ink);background:#f3f3f5}
.slot.has{border-style:solid;border-color:var(--line);background:#f4f4f5;cursor:default}
.slot img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.slot .tag{position:absolute;left:8px;top:8px;font-size:11px;background:var(--ink);color:#fff;padding:2px 8px;border-radius:99px}
.slot .ctl{position:absolute;right:6px;bottom:6px;display:flex;gap:4px}
.slot .ctl button{width:28px;height:28px;border-radius:8px;border:0;background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(0,0,0,.12);font-size:13px}
.slot .busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.7)}
.prev{position:sticky;top:24px}
.prev .pv{overflow:hidden}
.prev .ph{aspect-ratio:4/5;background:linear-gradient(180deg,#f7f7f8,#efeff1);display:grid;place-items:center}
.prev .ph img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.prev .dots{display:flex;gap:5px;justify-content:center;padding:10px 0 0}
.prev .dots i{width:6px;height:6px;border-radius:50%;background:#d6d7db}.prev .dots i.on{background:var(--ink)}
.prev .bd{padding:14px 18px 18px;display:flex;flex-direction:column;gap:4px}
.prev .bd .br{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.prev .bd .tt{font-size:17px;font-weight:600;letter-spacing:-.01em}
.prev .bd .pr{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.prev .bd .dl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--g2)}
@media (max-width:1100px){.addg{grid-template-columns:1fr}.prev{position:static}}

/* ---------- Товары ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{max-width:340px}
.status-tag{position:absolute;left:10px;top:10px}

/* ---------- Карточка товара (панель) ---------- */
.drawer{position:fixed;inset:0;z-index:40;background:rgba(20,21,24,.36);display:flex;justify-content:flex-end;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.drawer .in{width:min(780px,100%);height:100%;overflow:auto;background:var(--bg);padding:26px;animation:sl .25s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{transform:translateX(40px)}}
.imgs{display:flex;gap:10px;flex-wrap:wrap}
.imgs figure{margin:0;width:118px;display:flex;flex-direction:column;gap:5px}
.imgs img{width:118px;height:146px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:12px}
.imgs figure.cover img{box-shadow:0 0 0 2px var(--ink)}
.imgs .ctl{display:flex;gap:3px}
.imgs .ctl button{flex:1;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:11px;padding:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.hist{font-size:12.5px;color:var(--g2);display:flex;flex-direction:column;gap:5px}
.btn.danger{background:none;border:1px solid #f0c9c5;color:var(--err);font-weight:500}
.btn.danger:hover{background:var(--err-bg)}
.actbar .btn.danger{border-color:rgba(255,255,255,.2);color:#ffb4ad}
.modal{position:fixed;inset:0;z-index:70;background:rgba(20,21,24,.4);display:grid;place-items:center;padding:16px;animation:fd .15s}
.modal .box{background:#fff;border-radius:20px;padding:22px;width:min(420px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px;font-size:17px}.modal p{margin:0 0 18px;color:var(--g2);font-size:14px;line-height:1.5}
.modal .row{justify-content:flex-end}
#busy{position:fixed;left:0;top:0;height:2px;width:0;background:var(--ink);z-index:80;transition:width .3s,opacity .3s;opacity:0}
#busy.on{opacity:1;width:70%;transition:width 8s cubic-bezier(.1,.7,.2,1),opacity .2s}
.pc .ck2{position:absolute;left:10px;top:10px;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.95);border:1px solid var(--line);display:grid;place-items:center;z-index:2}
.pc .ck2 input{width:16px;height:16px;margin:0;accent-color:#1c1d20;cursor:pointer}
.status-tag{left:auto!important;right:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;z-index:60;opacity:0;transition:all .2s;pointer-events:none;font-weight:500}
.toast.on{opacity:1;transform:translate(-50%,0)}
body:has(.actbar) .toast{bottom:96px}

/* ---------- Вход ---------- */
.login-wrap{min-height:100%;display:grid;place-items:center;padding:20px;background:var(--side)}
.login{width:min(380px,100%);padding:30px;display:flex;flex-direction:column;gap:14px}
.login .wm{font-size:24px;letter-spacing:.02em;text-transform:none}

/* ---------- Мобильная версия ---------- */
@media (max-width:900px){
  .shell{grid-template-columns:1fr;background:var(--bg)}
  .actbar{left:12px;right:12px;transform:none;max-width:none;padding:8px 8px 8px 14px;gap:6px;bottom:12px}
  .actbar>span{font-size:12.5px;flex:1}
  .actbar .btn.sm{padding:7px 10px;font-size:12.5px}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:8px}
  .logo{padding:0 6px 0 4px}.logo span{display:none}.logo b{font-size:18px}
  .nav{flex-direction:row;overflow-x:auto;flex:1;scrollbar-width:none}
  .nav button{padding:8px 11px;white-space:nowrap}.nav button svg{display:none}
  .pump,.who{display:none}
  .main{padding:22px 16px 110px}
  .head h1{font-size:23px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .jstats{grid-template-columns:repeat(3,1fr)}
  .sub-g,.step>.hint{margin-left:0}
  .pgrid{grid-template-columns:repeat(2,1fr);gap:10px}
  .li .pr{display:none}
}

/* ---------- Товары и поставщики ---------- */
.pfilters select{width:auto;min-width:150px;max-width:220px}
.pshow{margin-top:8px;font-size:13px;padding-top:8px;border-top:1px solid var(--line)}
.supprev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.supprev div{display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0}
.supprev img,.supprev i{width:100%;aspect-ratio:4/5;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px}
.supprev span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.supprev small{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
@media (max-width:900px){.pfilters select{flex:1;max-width:none;min-width:0}.pfilters input{max-width:none}}

/* ---------- Витрина: списки, поле фото, выбор товара ---------- */
.cms-li{gap:12px}
.cms-li.sel{background:#f4f4f6}
.ck2.static{position:static;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;flex:none;background:#fff}
.ck2.static input{width:16px;height:16px;margin:0;accent-color:#1c1d20;cursor:pointer}
.cms-th{width:76px;height:52px;border-radius:10px;background:var(--soft);overflow:hidden;display:grid;place-items:center;color:var(--muted);flex:none}
.cms-th.round{width:52px;border-radius:50%}
.cms-th img{width:100%;height:100%;object-fit:cover}
.cms-li .t .pill{margin-top:4px;font-weight:500}
.cms-ctl{display:flex;align-items:center;gap:6px;flex:none}
.cms-ctl .toggle{margin-left:6px}
.form{display:flex;flex-direction:column;gap:16px}
.imgf-row{display:flex;gap:12px;align-items:center;margin-top:7px}
.imgf-pv{width:120px;height:80px;border-radius:12px;background:var(--soft);display:grid;place-items:center;overflow:hidden;color:var(--muted);flex:none;border:1px solid var(--line)}
.imgf-pv img{width:100%;height:100%;object-fit:cover}
.imgf-act{display:flex;gap:6px;flex-wrap:wrap}
.actf{display:flex;flex-direction:column;gap:8px}
.ppick{display:flex;flex-direction:column;gap:8px}
.pchips{display:flex;flex-direction:column;gap:6px}
.pchip{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:6px 8px;font-size:13px}
.pchip img{width:36px;height:44px;object-fit:contain;background:#fff;border-radius:7px;mix-blend-mode:multiply}
.pchip span{flex:1;min-width:0}
.pchip button{border:0;background:#fff;width:28px;height:28px;border-radius:8px;flex:none}
.ppick-res{display:flex;flex-direction:column;border-radius:12px;overflow:hidden}
.ppick-res:not(:empty){border:1px solid var(--line)}
.pres{display:flex;gap:10px;align-items:center;border:0;border-top:1px solid var(--line);background:#fff;padding:8px 10px;text-align:left;font-size:13px}
.pres:first-child{border-top:0}.pres:hover{background:var(--soft)}
.pres img,.pres i{width:34px;height:42px;object-fit:contain;flex:none;background:var(--soft);border-radius:6px}
.pres small{display:block;color:var(--muted)}
.slides{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.slide{display:flex;flex-direction:column;gap:12px;box-shadow:none}
pre.msg{white-space:pre-wrap;font:13px/1.5 var(--f);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:0}
.cline{flex-wrap:nowrap;margin-bottom:8px}
.nav .cnt.red,.mnav .cnt{background:#e0463b;color:#fff}

/* ---------- Панель редактора ---------- */
.sheet .in{padding:0;display:flex;flex-direction:column;width:min(620px,100%)}
.sh-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:2}
.sh-h b{font-size:16px}
.sh-b{padding:20px;flex:1}
.sh-f{position:sticky;bottom:0;display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px calc(14px + var(--sb));background:#fff;border-top:1px solid var(--line)}
.sh-f .btn.lg{flex:1}

/* ---------- Нижнее меню (телефон, Telegram) ---------- */
.mnav{display:none}
@media (max-width:900px){
  .side .nav{display:none}
  .shell{grid-template-rows:auto 1fr;align-content:start}
  .cms-li .t span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .side{justify-content:center}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sb))}
  .mnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:4px 0;position:relative;font-weight:500}
  .mnav button svg{width:22px;height:22px}
  .mnav button.on{color:var(--fg)}
  .mnav button.plus svg{width:34px;height:34px;padding:7px;border-radius:12px;background:var(--ink-g);color:#fff;margin-top:-4px}
  .mnav .cnt{position:absolute;top:0;left:calc(50% + 6px);font-size:10px;font-style:normal;padding:0 5px;border-radius:99px;min-width:16px;text-align:center;line-height:16px}
  .main{padding:18px 14px calc(96px + var(--sb))}
  .actbar{bottom:calc(72px + var(--sb));flex-wrap:wrap}
  .toast{bottom:calc(84px + var(--sb))}
  body:has(.actbar) .toast{bottom:calc(150px + var(--sb))}
  input[type=text],input[type=password],input[type=number],input[type=search],input[type=date],select,textarea{font-size:16px}
  .drawer .in{width:100%;padding:18px 14px calc(30px + var(--sb))}
  .sheet .in{padding:0}
  .sh-b{padding:16px 14px}
  .sh-f{padding:12px 14px calc(12px + var(--sb))}
  .cms-ctl .btn.sm{padding:6px 9px}
  .cms-th{width:56px;height:44px}.cms-th.round{width:44px}
  .cms-li{padding:12px}
  .head .btn{width:100%}
  .cline{flex-wrap:wrap;background:var(--soft);padding:10px;border-radius:12px}
  .seg{max-width:100%}
  .li{padding:12px 14px}
  .imgs figure{width:96px}.imgs img{width:96px;height:120px}
}
input[type=date]{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;min-height:44px}
html.tg .side{display:none}
html.tg .main{padding-top:14px}
/* ---------- Со скриншотов ---------- */
.scgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.scc.off{opacity:.5}
.scimgs{display:flex;gap:6px;overflow-x:auto;padding:10px 10px 0}
.scimgs figure{margin:0;position:relative;flex:none}
.scimgs img{width:96px;height:120px;object-fit:contain;background:#f4f4f5;border-radius:10px;display:block}
.scimgs button{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:12px;border:0;background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(0,0,0,.15)}
@media (max-width:900px){.scgrid{grid-template-columns:1fr}}

/* =====================================================================
   v2 · белый и графит, как приложение. Перекрывает старые стили выше.
   ===================================================================== */
:root{--bg:#ffffff;--card:#ffffff;--fg:#1f2125;--g2:#50545b;--muted:#6b6f76;--line:#e6e7ea;--soft:#f2f3f4;--soft2:#e9eaec;--ink:#1f2125;--ink-g:#1f2125;--sh:none;--r:20px;
  --ok:#2e7d52;--ok-bg:#e8f3ec;--warn:#8a5a14;--warn-bg:#f7eedf;--err:#b3261e;--err-bg:#fbeceb}
body{background:#fff;font-size:14.5px}
.card{border:1px solid var(--line);border-radius:20px;box-shadow:none}
.btn{border-radius:14px;padding:11px 16px;background:var(--ink);font-weight:600}
.btn.sm{border-radius:11px;padding:8px 12px}
.btn.lg{border-radius:16px;padding:15px 22px}
.btn.soft{background:var(--soft)}.btn.ghost{border-color:var(--line)}
input[type=text],input[type=password],input[type=number],input[type=search],input[type=date],select,textarea{border-radius:14px;border-color:var(--line);min-height:46px}
textarea{min-height:110px}
.seg{border-radius:14px;padding:3px;background:var(--soft)}
.seg button{border-radius:11px;padding:9px 14px}
.chip{border-color:var(--line)}
.head{margin-bottom:18px}.head h1{font-size:30px;letter-spacing:-.03em}.head p{font-size:14px;line-height:1.5;max-width:640px}
.note-box{border-radius:16px}
.li{padding:14px 16px}.li:hover{background:#fafafb}
.pill{background:var(--soft)}
.drawer{background:rgba(20,21,24,.32)}
.drawer .in{background:#fff}
.sheet .in{border-radius:0}
.sh-h{border-bottom:1px solid var(--line)}
.actbar{border-radius:18px;background:var(--ink)}
.toast{border-radius:14px;background:var(--ink)}

/* ---------- каркас ---------- */
.shell{grid-template-columns:260px 1fr;background:#fff}
.side{background:#fff;color:var(--fg);border-right:1px solid var(--line);padding:22px 14px 16px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.logo .lg-av{width:38px;height:38px;border-radius:19px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:14px;flex:none}
.logo b{font-family:var(--serif);font-weight:400;font-size:19px;color:var(--fg)}
.logo span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.plusbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 14px;padding:12px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:600}
.nav button{color:var(--g2);border-radius:12px;padding:10px 12px}
.nav button:hover{background:var(--soft);color:var(--fg)}
.nav button[aria-current=page]{background:var(--soft);color:var(--fg);font-weight:600}
.nav .cnt{background:var(--soft2);color:var(--fg)}.nav .cnt.red{background:var(--err);color:#fff}
.navlab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 12px 6px}
.pump{background:var(--soft);color:var(--g2)}.pump b{color:var(--fg)}.pump .bar{background:var(--soft2)}.pump .bar i{background:var(--ink)}
.who{border-top:1px solid var(--line);color:var(--g2)}.who .av{background:var(--ink)}.who button{color:var(--muted)}.who button:hover{color:var(--fg)}
.main{padding:30px 40px 120px;max-width:1180px}
.mtop{display:none}
.mnav2{display:none}

/* ---------- общие блоки v2 ---------- */
.vh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.vh h1{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:0}
.vsub{color:var(--muted);font-size:14px;margin:4px 0 18px;line-height:1.5}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{padding:16px 18px;border-radius:20px;background:var(--soft);display:flex;flex-direction:column;gap:6px;border:0;text-align:left;color:var(--fg);text-decoration:none;cursor:pointer}
.tile span{font-size:13px;color:var(--muted)}.tile b{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1}
.tile.dark{background:var(--ink);color:#fff}.tile.dark span{color:#c4c6ca}
.row2{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:20px;background:#fff;text-decoration:none;color:var(--fg);cursor:pointer;width:100%;text-align:left}
.row2 .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.row2 .tx{flex:1;min-width:0;display:flex;flex-direction:column}.row2 .tx b{font-size:15px}.row2 .tx span{font-size:12.5px;color:var(--muted)}
.chev{width:16px;height:16px;flex:none;stroke:#8a8d93;fill:none;stroke-width:2}
.h2{font-size:18px;font-weight:700;margin:26px 0 10px;letter-spacing:-.01em}
.att{border:1px solid var(--line);border-radius:20px;overflow:hidden}
.att a{display:flex;align-items:center;gap:12px;padding:14px 16px;text-decoration:none;color:var(--fg);font-size:14px;border-top:1px solid var(--line)}
.att a:first-child{border-top:0}.att a:hover{background:#fafafb}
.att .d{width:8px;height:8px;border-radius:4px;flex:none;background:var(--g2)}.att .d.err{background:var(--err)}.att .d.warn{background:#c07a1a}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick button{height:92px;border-radius:18px;border:0;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--fg)}
.quick button svg{width:22px;height:22px}
.mini{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--g2)}.mini b{font-size:17px;color:var(--fg);display:block}

/* конструктор Ленты */
.blocks{display:flex;flex-direction:column;gap:8px}
.blk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer}
.blk.off{opacity:.55}
.blk .mv{display:flex;flex-direction:column;gap:2px}
.blk .mv button{width:30px;height:22px;border:0;background:var(--soft);border-radius:7px;font-size:11px;line-height:1;color:var(--g2)}
.blk .mv button:disabled{opacity:.35}
.blk .tx{flex:1;min-width:0;display:flex;flex-direction:column}.blk .tx b{font-size:14.5px}.blk .tx span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--soft2);position:relative;flex:none;cursor:pointer;margin:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw:checked{background:var(--ink)}.sw:checked::after{transform:translateX(18px)}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--soft);border-radius:99px;padding:8px 14px 8px 10px;font-weight:600;font-size:13px;margin-bottom:14px;color:var(--fg)}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* товары списком */
.fchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin:10px 0 12px}
.fchips::-webkit-scrollbar{display:none}
.fchip{position:relative;flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;color:var(--fg)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fchip select{position:absolute;inset:0;opacity:0;width:100%;min-height:0;cursor:pointer}
.plist{display:flex;flex-direction:column}
.prow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.prow .th{width:60px;height:72px;border-radius:12px;background:var(--soft);flex:none;overflow:hidden;display:grid;place-items:center}
.prow .th img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.prow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow .br{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .tt{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pr{font-size:13px}.prow .pr span{color:var(--muted)}
.prow .ck{width:22px;height:22px;accent-color:#1f2125;flex:none}
.pbar{position:sticky;bottom:12px;margin-top:14px;border-radius:18px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;z-index:5}
.pbar span{flex:1;font-size:13.5px;font-weight:600}
.pbar button{height:40px;padding:0 12px;border-radius:12px;border:0;font-weight:600;font-size:13px}
.pbar .w{background:#fff;color:var(--ink)}.pbar .g{background:#3a3d43;color:#fff}

/* заказы */
.orow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.orow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.orow .tx b{font-size:14.5px}.orow .tx span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--soft);white-space:nowrap}
.st.new{background:var(--err);color:#fff}.st.work{background:var(--soft2)}.st.paid,.st.bought,.st.shipping{background:var(--ink);color:#fff}.st.delivered{background:var(--ok-bg);color:var(--ok)}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.stages i{height:5px;border-radius:3px;background:var(--line)}.stages i.on{background:var(--ink)}
.stlab{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:10.5px;color:var(--muted);margin-top:4px}.stlab b{color:var(--fg)}
.client{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--soft)}
.client .av{width:44px;height:44px;border-radius:22px;background:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.client .tx{flex:1;min-width:0;display:flex;flex-direction:column}.client .tx span{font-size:12.5px;color:var(--muted)}
.client a{width:44px;height:44px;border-radius:22px;background:var(--ink);display:grid;place-items:center;flex:none}
.client a svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8}
.oitem{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.oitem:first-child{border-top:0}
.oitem .tx{flex:1;min-width:0;display:flex;flex-direction:column}.oitem .tx span{font-size:12.5px;color:var(--muted)}

/* финансы */
.fin{padding:18px;border-radius:22px;background:var(--ink);color:#fff;display:flex;flex-direction:column;gap:4px}
.fin span{font-size:12.5px;color:#c4c6ca}.fin b{font-size:36px;font-weight:700;letter-spacing:-.03em}
.bars{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:12px}.bars i{flex:1;border-radius:4px;background:#3a3d43;min-height:3px}.bars i:last-child{background:#fff}
.kvs{border:1px solid var(--line);border-radius:20px}
.kvs div{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;font-size:14px;border-top:1px solid var(--line)}.kvs div:first-child{border-top:0}
.brandbar{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.brandbar div{display:flex;justify-content:space-between;font-size:13.5px}.brandbar i{height:6px;border-radius:3px;background:var(--ink)}

/* меню «Ещё» и «＋» */
.menu{border:1px solid var(--line);border-radius:20px;overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-top:1px solid var(--line);background:#fff;text-align:left;font-size:15px;color:var(--fg)}
.menu button:first-child{border-top:0}.menu button:hover{background:#fafafb}
.menu button svg.i{width:20px;height:20px}.menu button .tx{flex:1;display:flex;flex-direction:column}.menu button .tx small{font-size:12.5px;color:var(--muted)}
.plusgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.plusgrid button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:18px;border:0;background:var(--soft);text-align:left;color:var(--fg)}
.plusgrid button svg.i{width:22px;height:22px}.plusgrid button b{font-size:14.5px}.plusgrid button small{font-size:12px;color:var(--muted);line-height:1.35}
.undo{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;z-index:65;box-shadow:0 12px 36px rgba(0,0,0,.25);font-size:14px;max-width:calc(100% - 24px)}
.undo button{border:0;background:#fff;color:var(--ink);border-radius:11px;padding:9px 12px;font-weight:700}
.bnpv{border-radius:18px;background:var(--soft);padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.bnpv small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bnpv .bn{position:relative;height:188px;border-radius:16px;overflow:hidden;background:var(--ink);color:#fff}
.bnpv .bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bnpv .bn .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(0,0,0,.6))}
.bnpv .bn.light{color:var(--fg);background:#e9e9eb}.bnpv .bn.light .ov{background:linear-gradient(180deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.88))}
.bnpv .tx{position:absolute;left:14px;right:14px;bottom:12px;display:flex;flex-direction:column;gap:3px}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = n => n === null || n === undefined ? "—" : new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 }).format(n) + " €";
const dt = s => s ? new Date(s).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
const plural = (n, f) => f[(n % 10 === 1 && n % 100 !== 11) ? 0 : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 1 : 2];
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2800); }
let busyN = 0, busyT = 0;
function busy(d) { busyN = Math.max(0, busyN + d); clearTimeout(busyT); const b = document.getElementById("busy"); if (!b) return;
  if (busyN) busyT = setTimeout(() => b.classList.add("on"), 250); else { b.classList.remove("on"); b.style.width = "100%"; setTimeout(() => { b.style.width = ""; }, 300); } }
function confirmBox(title, text, ok = "Удалить") {
  return new Promise(res => {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="box" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="row"><button class="btn soft" data-no>Отмена</button><button class="btn" data-yes style="background:var(--err)">${esc(ok)}</button></div></div>`;
    const done = v => { m.remove(); document.removeEventListener("keydown", kd); res(v); };
    const kd = e => { if (e.key === "Escape") done(false); if (e.key === "Enter") done(true); };
    m.onclick = e => { if (e.target === m || e.target.closest("[data-no]")) done(false); if (e.target.closest("[data-yes]")) done(true); };
    document.addEventListener("keydown", kd); document.body.append(m); m.querySelector("[data-yes]").focus();
  });
}
async function api(a, { method = "GET", body, query = {}, silent = false } = {}) {
  if (!silent) busy(1);
  try { return await api_(a, { method, body, query }); } finally { if (!silent) busy(-1); }
}
async function api_(a, { method, body, query }) {
  const u = "/api/admin?" + new URLSearchParams({ a, ...query });
  const r = await fetch(u, { method, credentials: "same-origin", headers: body ? { "Content-Type": "application/json", "X-TB": "1" } : { "X-TB": "1" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: "Сервер ответил с ошибкой (" + r.status + ")" }));
  if (r.status === 401 && a !== "login") { showLogin(); throw new Error(j.error); }
  if (!r.ok) throw new Error(j.error || "Ошибка " + r.status);
  return j;
}

/* ---------- Словари ---------- */
const IC = {
  home: '<path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>',
  load: '<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/>',
  jobs: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  products: '<path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  prices: '<path d="M4 12l8-8h8v8l-8 8z"/><circle cx="16" cy="8" r="1.4"/>',
  sources: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',
  warn: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>',
  ok: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/>',
  file: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>',
  add: '<path d="M12 5v14M5 12h14"/>',
  watch: '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/>',
  van: '<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.6"/><circle cx="17" cy="17.5" r="1.6"/>',
  show: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  leads: '<path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/>',
  screens: '<rect x="4" y="3" width="11" height="18" rx="2"/><path d="M15 8h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7"/><path d="M7 17h5"/>',
  more: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  img: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/>'
};
const svg = k => `<svg class="i" viewBox="0 0 24 24">${IC[k]}</svg>`;
const STATUS = { queued: ["В очереди", "run"], running: ["Загружается", "dark run"], waiting: ["Пауза, повтор", "warn run"], done: ["Готово", "ok"], failed: ["Ошибка", "err"], blocked: ["Сайт блокирует", "err"], cancelled: ["Отменено", ""] };
const MODE = { link: "Один товар", links: "По ссылкам", category: "Разделы сайта", full: "Весь каталог", file: "Файл" };
const IKIND = { new: "Новые", update: "Обновления", duplicate: "Возможные дубли", incomplete: "Неполные", error: "Ошибки", excluded: "Исключены", pricechange: "Изменения цен" };
const CATS = { bags: "Сумки", clothing: "Одежда", shoes: "Обувь", accessories: "Аксессуары", jewelry: "Украшения", eyewear: "Очки", watches: "Часы", fragrance: "Ароматы", other: "Другое" };
const LOADCATS = ["bags", "clothing", "shoes", "accessories", "jewelry", "eyewear"];
const AV = { online: ["онлайн", "ok"], boutique: ["в бутике", "warn"], out: ["нет", "err"], preorder: ["предзаказ", "warn"], unknown: ["?", ""] };
const REGION = { DE: "Германия", ES: "Испания", FR: "Франция", IT: "Италия" };
const CHECK = { ok: ["Доступ есть", "ok"], blocked: ["Сайт блокирует", "err"], error: ["Ошибка связи", "warn"], none: ["Нужен файл", ""] };
const ACTIVE = ["queued", "running", "waiting"];

let me = null, view = "home", sources = null, pumpOn = false, pumpActive = 0;

/* ---------- Вход ---------- */
function showLogin() { window.hideSplash && hideSplash(600); $("#appView").hidden = true; $("#loginView").hidden = false; setTimeout(() => $("#lgName").focus(), 50); }
$("#lgBtn").onclick = async () => {
  $("#lgErr").textContent = ""; $("#lgBtn").disabled = true;
  try { const r = await api("login", { method: "POST", body: { name: $("#lgName").value.trim() || "admin", password: $("#lgPw").value } }); me = r.name; await start(); }
  catch (e) { $("#lgErr").textContent = /Failed to fetch|NetworkError|Load failed/.test(e.message) ? "Нет связи с сервером — проверьте интернет и попробуйте ещё раз" : e.message; }
  $("#lgBtn").disabled = false;
};
$("#lgPw").addEventListener("keydown", e => { if (e.key === "Enter") $("#lgBtn").click(); });
$("#logout").onclick = async () => { await api("logout", { method: "POST", body: {} }).catch(() => {}); showLogin(); };

async function start() {
  let r; try { r = await api("me"); } catch { return; }
  me = r.name;
  $("#meName").textContent = r.name + (r.demo ? " · демо" : ""); $("#meAv").textContent = (r.name || "?").slice(0, 1).toUpperCase();
  renderNav();
  $("#loginView").hidden = true; $("#appView").hidden = false;
  go(location.hash.slice(1) || "home");
  window.hideSplash && hideSplash();
  pump(); pollLeads();
}
// новые заявки: счётчик в меню обновляется раз в минуту
async function pollLeads() { try { const { fresh } = await api("leads", { query: { status: "new" }, silent: true }); updateLeadBadge(fresh); } catch {} clearTimeout(pollLeads.t); pollLeads.t = setTimeout(pollLeads, 60000); }
document.addEventListener("click", e => {
  const b = e.target.closest("#nav [data-v],#nav2 [data-v]"); if (b) return go(b.dataset.v);
  const m = e.target.closest("#mnav2 [data-m]"); if (m) return m.dataset.m === "plus" ? plusSheet() : go(m.dataset.m);
  if (e.target.closest("#plusBtn")) return plusSheet();
  if (e.target.closest("#mBack")) return go(backTarget());
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h !== view) go(h); });
function go(v) {
  view = v; if (location.hash.slice(1) !== v) location.hash = v;
  const k = v.split(":")[0];
  document.querySelectorAll("#nav button").forEach(b => b.dataset.v === (k === "job" ? "jobs" : k) ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  $("#main").innerHTML = `<div class="empty"><span class="spin"></span></div>`; $("#main").onclick = $("#main").oninput = $("#main").onchange = null; $(".actbar")?.remove();
  document.querySelectorAll(".drawer").forEach(x => x.remove()); tgBack.stack = [];
  window.scrollTo(0, 0); navSync();
  const fn = { home: vHome2, add: vAdd, watch: vWatch, load: vLoad, jobs: vJobs, job: vJob, products: vProducts2, prices: vPrices, sources: vSources, show: vShow, leads: vOrders, screens: vScreens, finance: vFinance, more: vMore }[k] || vHome2;
  fn(v.split(":")[1]).catch(e => { $("#main").innerHTML = `<div class="note-box err">${svg("warn")}<div>${esc(e.message)}</div></div>`; });
}
async function getSources(force) { if (!sources || force) sources = (await api("sources")).sources; return sources; }
const head = (t, p, extra = "") => `<div class="head"><div><h1>${t}</h1>${p ? `<p>${p}</p>` : ""}</div><span class="sp"></span>${extra}</div>`;

/* ---------- Фоновая обработка: пока админка открыта, очередь двигается на любой вкладке ---------- */
async function pump() {
  if (pumpOn) return; pumpOn = true;
  try {
    while (true) {
      let jobs; try { jobs = (await api("jobs", { silent: true })).jobs; } catch { break; }
      const act = jobs.filter(j => ACTIVE.includes(j.status)); pumpActive = act.length;
      const cnt = $("#jobCnt"); if (cnt) { cnt.hidden = !act.length; cnt.textContent = act.length; }
      const p = $("#pump");
      if (!act.length) { p.hidden = true; break; }
      const j = act[0], pct = j.found ? Math.round(j.processed / j.found * 100) : 0;
      p.hidden = false;
      p.innerHTML = `<b>${esc(srcName(j.sourceId))}</b> · ${esc(STATUS[j.status][0].toLowerCase())}<div>${j.phase === "discover" ? "ищем товары… найдено " + j.found : `${j.processed} из ${j.found}`}</div><div class="bar"><i style="width:${j.phase === "discover" ? 8 : pct}%"></i></div>`;
      if (view === "job:" + j._id || view === "jobs") refreshCurrent();
      try { await api("tick", { method: "POST", body: {}, silent: true }); } catch {}
      await new Promise(r => setTimeout(r, 1200));
    }
  } finally { pumpOn = false; }
  if (view === "jobs" || view.startsWith("job:")) refreshCurrent(true);
}
let refreshT = 0;
function refreshCurrent(force) { const now = Date.now(); if (!force && now - refreshT < 2500) return; refreshT = now; if (view === "jobs") vJobs(true); else if (view.startsWith("job:")) vJob(view.split(":")[1], true); }
const srcName = id => id === "manual" ? "Добавлен вручную" : (sources || []).find(s => s.id === id)?.name || id;

/* ---------- Обзор ---------- */
function brandCard(s) {

      <div><h3 style="margin-bottom:10px">Категория</h3><div class="chips" id="fCat">${LOADCATS.concat(["watches"]).map(c => `<button class="chip" data-fcat="${c}" aria-pressed="${F.category === c}">${CATS[c]}</button>`).join("")}</div></div>
      <div class="seg" id="fG">${[["w", "Женское"], ["m", "Мужское"], ["u", "Унисекс"]].map(([k, v]) => `<button data-fg="${k}" aria-pressed="${F.gender === k}">${v}</button>`).join("")}</div>
      <div class="row" style="align-items:flex-end">
        <label class="f" style="flex:1;min-width:180px">Цена в бутике, €<input type="number" id="fPrice" min="1" step="1" inputmode="decimal" value="${esc(F.boutique)}" placeholder="3000"></label>
        <div style="flex:2;min-width:240px" class="hint" id="fCalc">Наша цена появится здесь</div></div>
      <div><h3 style="margin-bottom:10px">Размеры <span class="hint" style="font-weight:400">если есть</span></h3><div class="chips" id="fSizes"></div>
        <div class="row" style="margin-top:10px"><input type="text" id="fSizeIn" placeholder="Свой размер, например 38.5" style="max-width:240px"><button class="btn ghost sm" id="fSizeAdd">Добавить</button></div></div>
      <div class="row" style="align-items:flex-end"><label class="f" style="flex:1;min-width:180px">Цвет<input type="text" id="fColor" value="${esc(F.color)}" placeholder="Monogram, Black…"></label>
        <label class="f" style="flex:2;min-width:240px">Ссылка на товар у бренда <span class="hint" style="font-weight:400">для менеджера, клиенту не видна</span><input type="text" id="fUrl" value="${esc(F.url)}" placeholder="https://…"></label></div>
      <div><h3 style="margin-bottom:10px">Наличие</h3><div class="seg" id="fAv">${[["online", "Можно заказать"], ["boutique", "Уточнить наличие"], ["out", "Нет в наличии"]].map(([k, v]) => `<button data-fav="${k}" aria-pressed="${F.availability === k}">${v}</button>`).join("")}</div></div>
      <div><h3 style="margin-bottom:4px">Уже выкуплено, лежит у нас</h3><p class="hint" style="margin:0 0 10px">Товар попадёт в блок «В наличии» с быстрой доставкой</p><div class="seg" id="fSt">${[["", "Нет"], ["ua", "В Украине"], ["eu", "В Европе"]].map(([k, v]) => `<button data-fst="${k}" aria-pressed="${F.stock.loc === k}">${v}</button>`).join("")}</div>
        <div class="row" id="fStX" style="margin-top:10px" ${F.stock.loc ? "" : "hidden"}><input type="text" id="fStCity" value="${esc(F.stock.city)}" placeholder="Город, напр. Киев" style="flex:1;min-width:150px"><input type="text" id="fStSize" value="${esc(F.stock.size)}" placeholder="Размер, если есть" style="flex:1;min-width:120px"></div></div>
      <div class="row" style="padding-top:6px;border-top:1px solid var(--line)"><button class="btn lg" id="fPub">${editId ? "Сохранить" : "Опубликовать на витрину"}</button><button class="btn ghost lg" id="fDraft">В черновик</button><span class="err" id="fErr"></span></div>
    </div>
    <aside class="prev"><div class="hint" style="margin:0 0 8px 4px">Так увидит клиент</div><div class="card pv" id="pv"></div></aside>
  </div>`;
  const drawSlots = () => {
    const n = Math.max(3, F.images.length + (F.images.length < 8 ? 1 : 0));
    $("#slots").innerHTML = Array.from({ length: n }, (_, i) => {
      const u = F.images[i];
      if (u) return `<div class="slot has">${i === 0 ? '<span class="tag">обложка</span>' : ""}<img src="${esc(u)}" alt=""><div class="ctl">${i ? `<button data-left="${i}" aria-label="Левее">←</button>` : ""}<button data-rm="${i}" aria-label="Убрать">×</button></div></div>`;
      return `<div class="slot" data-pick>${busy && i === F.images.length ? '<span class="spin"></span>Загружаем…' : `${svg("img")}<span>${i === 0 ? "Главное фото" : "Фото " + (i + 1)}</span>`}</div>`;
    }).join("");
  };
  const drawSizes = () => {
    const preset = SIZE_PRESETS[F.category] || [];
    const all = [...new Set([...preset, ...F.sizes])];
    $("#fSizes").innerHTML = all.length ? all.map(z => `<button class="chip" data-fsz="${esc(z)}" aria-pressed="${F.sizes.includes(z)}">${esc(z)}</button>`).join("") : `<span class="hint">Для этой категории размеров нет — добавьте свой, если нужно</span>`;
  };
  const drawPrev = () => {
    const img = F.images[shot] || F.images[0];
    $("#pv").innerHTML = `<div class="ph">${img ? `<img src="${esc(img)}" alt="">` : `<span class="hint">${svg("img")}</span>`}</div>
      ${F.images.length > 1 ? `<div class="dots">${F.images.map((_, i) => `<i class="${i === shot ? "on" : ""}" data-shot="${i}"></i>`).join("")}</div>` : ""}
      <div class="bd"><span class="br">${esc(F.brand || "Бренд")}</span><span class="tt">${esc(F.title || "Название")}</span>
      ${F.sizes.length ? `<div class="hint">Размеры: ${esc(F.sizes.join(", "))}</div>` : ""}
      <span class="pr num">${price ? eur(price.ua) : "— €"}</span><span class="dl">${svg("van")}С доставкой в Украину</span>
      ${price ? `<span class="hint">Европа и Дубай: ${eur(price.eu)} + доставка</span>` : ""}</div>`;
  };
  let pt;
  const calc = () => { clearTimeout(pt); pt = setTimeout(async () => {
    const b = Number(F.boutique);
    if (!(b > 0)) { price = null; $("#fCalc").textContent = "Наша цена появится здесь"; return drawPrev(); }
    try { price = await api("pricePreview", { method: "POST", body: { boutique: b } }); $("#fCalc").innerHTML = `На витрине: <b class="num" style="color:var(--fg)">${eur(price.ua)}</b> Украина с доставкой · ${eur(price.eu)} Европа/Дубай + доставка`; } catch {}
    drawPrev();
  }, 250); };
  const resize = file => fileToJpegB64(file, 1600);
  const addFiles = async files => {
    for (const f of [...files].slice(0, 8 - F.images.length)) {
      if (!/^image\//.test(f.type) && !/\.(heic|jpe?g|png|webp)$/i.test(f.name)) { toast("Это не фото: " + f.name); continue; }
      busy++; drawSlots();
      try { const data = await resize(f); const { url } = await api("imageUpload", { method: "POST", body: { data } }); F.images.push(url); }
      catch (e) { toast(e.message); }
      busy--; drawSlots(); drawPrev();
    }
  };
  drawSlots(); drawSizes(); drawPrev(); calc();
  if ($("#bmk")) { $("#bmk").href = BOOKMARKLET; $("#bmk").onclick = e => { e.preventDefault(); toast("Перетащите кнопку на панель закладок браузера"); }; }
  const main = $("#main");
  main.onclick = e => {
    const t = e.target.closest("[data-pick],[data-rm],[data-left],[data-fcat],[data-fg],[data-fav],[data-fst],[data-fsz],[data-shot],button"); if (!t) return;
    if ("pick" in t.dataset) return $("#fpick").click();
    if (t.dataset.rm) { F.images.splice(+t.dataset.rm, 1); shot = 0; drawSlots(); return drawPrev(); }
    if (t.dataset.left) { const i = +t.dataset.left; [F.images[i - 1], F.images[i]] = [F.images[i], F.images[i - 1]]; drawSlots(); return drawPrev(); }
    if (t.dataset.fcat) { F.category = t.dataset.fcat; document.querySelectorAll("[data-fcat]").forEach(b => b.setAttribute("aria-pressed", b.dataset.fcat === F.category)); F.sizes = F.sizes.filter(z => !Object.values(SIZE_PRESETS).flat().includes(z) || (SIZE_PRESETS[F.category] || []).includes(z)); drawSizes(); return drawPrev(); }
    if (t.dataset.fg) { F.gender = t.dataset.fg; document.querySelectorAll("[data-fg]").forEach(b => b.setAttribute("aria-pressed", b.dataset.fg === F.gender)); return; }
    if (t.dataset.fst !== undefined) { F.stock.loc = t.dataset.fst; document.querySelectorAll("[data-fst]").forEach(b => b.setAttribute("aria-pressed", b.dataset.fst === F.stock.loc)); $("#fStX").hidden = !F.stock.loc; return; }
    if (t.dataset.fav) { F.availability = t.dataset.fav; document.querySelectorAll("[data-fav]").forEach(b => b.setAttribute("aria-pressed", b.dataset.fav === F.availability)); return; }
    if (t.dataset.fsz) { const z = t.dataset.fsz; F.sizes = F.sizes.includes(z) ? F.sizes.filter(x => x !== z) : [...F.sizes, z]; t.setAttribute("aria-pressed", F.sizes.includes(z)); return drawPrev(); }
    if (t.dataset.shot) { shot = +t.dataset.shot; return drawPrev(); }
    if (t.id === "fSizeAdd") { const v = $("#fSizeIn").value.trim(); if (v && !F.sizes.includes(v)) F.sizes.push(v); $("#fSizeIn").value = ""; drawSizes(); return drawPrev(); }
    if (t.id === "furlAdd") { const v = $("#furl").value.trim(); if (!/^https:\/\//.test(v)) return toast("Нужна ссылка https://…"); if (F.images.length < 8) F.images.push(v); $("#furl").value = ""; drawSlots(); return drawPrev(); }
    if (t.id === "fPub" || t.id === "fDraft") return save(t.id === "fDraft" ? "draft" : "published", t);
  };
  main.oninput = e => {
    const id = e.target.id;
    if (id === "fBrand") F.brand = e.target.value; else if (id === "fTitle") F.title = e.target.value; else if (id === "fColor") F.color = e.target.value; else if (id === "fUrl") F.url = e.target.value; else if (id === "fStCity") F.stock.city = e.target.value; else if (id === "fStSize") F.stock.size = e.target.value;
    else if (id === "fPrice") { F.boutique = e.target.value; calc(); }
    if (["fBrand", "fTitle"].includes(id)) drawPrev();
  };
  main.onkeydown = e => { if (e.key === "Enter" && e.target.id === "fSizeIn") { e.preventDefault(); $("#fSizeAdd").click(); } if (e.key === "Enter" && e.target.id === "furl") { e.preventDefault(); $("#furlAdd").click(); } };
  $("#fpick").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
  $("#slots").addEventListener("dragover", e => { e.preventDefault(); e.target.closest(".slot")?.classList.add("over"); });
  $("#slots").addEventListener("dragleave", e => e.target.closest(".slot")?.classList.remove("over"));
  $("#slots").addEventListener("drop", e => { e.preventDefault(); addFiles(e.dataTransfer.files); });
  const save = async (status, btn) => {
    $("#fErr").textContent = "";
    if (busy) return toast("Подождите, фото ещё загружаются");
    const t = btn.textContent; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try {
      const { product } = await api("manualSave", { method: "POST", body: { ...F, status, boutique: Number(F.boutique) } });
      toast(status === "draft" ? "Сохранено в черновик" : `На витрине: ${product.title} · ${eur(product.pricing?.ua)}`);
      if (editId) go("products"); else vAdd();
    } catch (err) { $("#fErr").textContent = err.message; btn.disabled = false; btn.textContent = t; }
  };
}

/* ---------- Мониторинг (личный раздел в мини-аппе) ---------- */
async function vWatch() {
  let { code, tiles } = await api("watchGet");
  const draw = () => {
    $("#main").innerHTML = head("Мониторинг", "Личный раздел в мини-аппе: плитки открывают разделы официальных сайтов — все товары, фото и цены в реальном времени") + `
    <div class="card pad" style="display:flex;flex-direction:column;gap:12px;max-width:920px">
      <div class="row"><div><b>Код доступа: <span class="num" style="font-size:20px;letter-spacing:.12em">${esc(code)}</span></b><div class="hint">В мини-аппе удерживайте заголовок «Лента» 2 секунды и введите код — раздел появится только у вас. Клиенты его не видят.</div></div><span class="sp"></span><button class="btn ghost sm" id="wNew">Сменить код</button></div>
    </div>
    <div class="sec" style="max-width:920px"><h2>Плитки <small>${tiles.length}</small></h2>
      <div class="card list" id="wl">${tiles.map((t, i) => `<div class="li" style="cursor:default;gap:10px;flex-wrap:wrap" data-i="${i}">
        <input type="text" data-k="brand" value="${esc(t.brand)}" placeholder="Бренд" style="max-width:170px">
        <input type="text" data-k="title" value="${esc(t.title)}" placeholder="Название, напр. Мужские сумки" style="max-width:240px">
        <input type="text" data-k="url" value="${esc(t.url)}" placeholder="Ссылка на раздел сайта https://…" style="flex:1;min-width:220px">
        <button class="btn ghost sm" data-open="${i}">Открыть</button><button class="btn soft sm" data-del="${i}" aria-label="Удалить">×</button></div>`).join("") || `<div class="empty"><b>Плиток пока нет</b>Откройте нужный раздел на сайте бренда (например, мужские сумки LV), скопируйте адрес и добавьте плитку</div>`}</div>
      <div class="row" style="margin-top:12px"><button class="btn ghost" id="wAdd">${svg("add")}Добавить плитку</button><span class="sp"></span><button class="btn" id="wSave">Сохранить</button></div>
      <p class="hint">Порядок плиток = порядок в мини-аппе. Раздел открывается внутри Telegram, листать можно как на сайте бренда.</p></div>`;
  };
  const read = () => [...document.querySelectorAll("#wl [data-i]")].map(r => ({ id: tiles[+r.dataset.i]?.id, brand: r.querySelector('[data-k=brand]').value, title: r.querySelector('[data-k=title]').value, url: r.querySelector('[data-k=url]').value }));
  draw();
  $("#main").onclick = async e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.id === "wAdd") { tiles = read(); tiles.push({ brand: "Louis Vuitton", title: "", url: "" }); draw(); document.querySelector("#wl [data-i]:last-child [data-k=title]")?.focus(); return; }
    if (t.dataset.del) { tiles = read(); tiles.splice(+t.dataset.del, 1); return draw(); }
    if (t.dataset.open) { const u = read()[+t.dataset.open]?.url; if (/^https:\/\//.test(u)) window.open(u, "_blank", "noopener"); return; }
    if (t.id === "wSave" || t.id === "wNew") {
      try { const r = await api("watchSave", { method: "POST", body: { tiles: read(), newCode: t.id === "wNew" } }); code = r.code; tiles = r.tiles; draw(); toast(t.id === "wNew" ? "Новый код: " + code : "Сохранено: " + tiles.length + " " + plural(tiles.length, ["плитка", "плитки", "плиток"])); }
      catch (err) { toast(err.message); }
    }
  };
}

/* ---------- Задачи ---------- */
async function vJobs(quiet) {
  const [{ jobs }] = await Promise.all([api("jobs"), getSources()]);
  if (quiet && view !== "jobs") return;
  $("#main").innerHTML = head("Задачи загрузки", "Загрузка продолжается в фоне. Пока админка открыта — быстрее.", `<button class="btn" data-go="load">${svg("load")}Новая загрузка</button>`) +
    `<div class="card list">${jobs.length ? jobs.map(jobRow).join("") : `<div class="empty"><b>Задач пока нет</b>Нажмите «Новая загрузка»</div>`}</div>`;
  $("#main").onclick = homeClick;
}

async function vJob(id, quiet) {
  const [{ job: j }, { items, counts }] = await Promise.all([api("job", { query: { id } }), api("items", { query: { jobId: id } })]);
  await getSources();
  if (quiet && view !== "job:" + id) return;
  if (!j) { if (quiet) return; throw new Error("Задача не найдена"); }
  const sig = JSON.stringify(counts) + "|" + items.length + "|" + items.filter(i => i.publishedAs).length + "|" + (j?.meta?.catalog ? j.status : "");
  const keep = quiet ? { kind: vJob.kind, sel: new Set(vJob.sel || []), y: window.scrollY, shown: vJob.shown } : { kind: null, sel: new Set(), y: 0, shown: 60 };
  const pc = items.filter(i => i.kind === "update" && i.priceBefore !== null && i.priceBefore !== undefined && i.priceBefore !== i.pricing.ua);
  counts.pricechange = pc.length;
  const kinds = Object.keys(IKIND).filter(k => counts[k]);
  let kind = keep.kind && counts[keep.kind] ? keep.kind : kinds[0] || "new";
  vJob.kind = kind; vJob.sel = [...keep.sel]; vJob.shown = keep.shown;
  const st = STATUS[j.status] || [j.status, ""];
  const pct = j.found ? Math.round(j.processed / j.found * 100) : 0;
  const what = (j.onlyCats && j.onlyCats.length ? j.onlyCats.map(c => CATS[c] || c).join(", ") : MODE[j.mode] || j.mode) + (j.gender ? (j.gender === "w" ? " · женское" : " · мужское") : "");
  const blockedTxt = j.status === "blocked" ? `<div class="note-box err">${svg("warn")}<div><b>Сайт ${esc(srcName(j.sourceId))} не пускает автоматическую загрузку с нашего сервера.</b><br>Это защита сайта от роботов — обходить её мы не будем. Что делать: загрузить товары файлом CSV (шаблон есть на вкладке «Загрузка → Файл»), либо подключить официальный фид бренда, если он есть.<div style="margin-top:10px"><button class="btn sm" data-go="load:file">Загрузить файлом</button></div></div></div>` : "";
  const lastErr = j.errors?.length ? j.errors[j.errors.length - 1] : null;
  const failTxt = j.status === "failed" || (j.status === "done" && !j.processed && lastErr) ? `<div class="note-box err">${svg("warn")}<div><b>Загрузка не удалась.</b> Последняя ошибка: ${esc(lastErr?.text || "неизвестно")}${lastErr?.url && !lastErr.url.startsWith("row:") ? `<div class="hint" style="margin-top:4px">${esc(lastErr.url)}</div>` : ""}</div></div>` : "";
  const cov = j.coverage || {};
  const unav = (cov.unavailable || []).slice(-3);
  const btns = `<button class="btn ghost sm" data-go="jobs">Все задачи</button>${ACTIVE.includes(j.status) ? `<button class="btn soft sm" data-cancel="${esc(j._id)}">Остановить</button>` : ""}<button class="btn danger sm" data-deljob="${esc(j._id)}">Удалить задачу</button>`;
  const jheadInner = `
    <div class="row"><span class="pill ${st[1]}"><span class="dot"></span>${st[0]}</span><span class="hint">${ACTIVE.includes(j.status) ? (j.phase === "discover" ? "Ищем товары в каталоге…" : `Обработано ${j.processed} из ${j.found}`) : j.finishedAt ? "Завершено " + dt(j.finishedAt) : ""}</span><span class="sp"></span><span class="hint num">${pct}%</span></div>
    <div class="bar"><i style="width:${ACTIVE.includes(j.status) && j.phase === "discover" ? 6 : pct}%"></i></div>
    <div class="jstats">
      <div><span>Найдено</span><b class="num">${j.found}</b></div><div><span>Обработано</span><b class="num">${j.processed}</b></div>
      ${j.meta?.catalog ? `<div><span>Сохранено в «Товары»</span><b class="num">${j.saved || 0}</b></div><div><span>Пропущено</span><b class="num">${j.skipped || 0}</b></div>` : `<div><span>Новые</span><b class="num">${counts.new || 0}</b></div><div><span>Обновления</span><b class="num">${counts.update || 0}</b></div>`}
      <div><span>Не подошли по фильтру</span><b class="num">${j.filtered || 0}</b></div><div><span>Ошибки</span><b class="num">${j.errors?.length || 0}</b></div>
    </div>
    ${blockedTxt}${failTxt}
    ${unav.length && j.status !== "blocked" ? `<div class="note-box warn">${svg("info")}<div>Недоступно: ${unav.map(u => esc(u.reason)).join("; ")}</div></div>` : ""}
    ${j.meta?.warn ? `<div class="note-box warn">${svg("info")}<div>${esc(j.meta.warn)}</div></div>` : ""}`;
  if (quiet && vJob.sig === sig && vJob.id === id && $(".jhead")) {
    // список товаров не изменился — обновляем только прогресс, не трогая выбор, прокрутку и выпадающие списки
    $(".jhead").innerHTML = jheadInner;
    const hb = $("#jhBtns"); if (hb) hb.innerHTML = btns;
    return;
  }
  vJob.sig = sig; vJob.id = id;
  $("#main").innerHTML = head(`${esc(srcName(j.sourceId))} — ${esc(what)}`, `${dt(j.createdAt)} · ${esc(j.createdBy)}`, `<div class="row" id="jhBtns">${btns}</div>`) + `
  <div class="card jhead">${jheadInner}
  </div>
  ${items.length ? `<div class="tabs" id="kTabs">${Object.keys(IKIND).filter(k => counts[k]).map(k => `<button data-kind="${k}" aria-pressed="${k === kind}">${IKIND[k]}<span class="c num">${counts[k]}</span></button>`).join("")}</div><div class="pgrid" id="pg"></div><div class="more" id="more"></div>`

    </div>
    <div class="sec"><h2>На витрине</h2><div class="card pad hint">${storefront ? `Показывается как «${esc(storefront.title)}» · ${eur(storefront.price.ua)} Украина · ${eur(storefront.price.eu)} Европа/Дубай · наличие: ${esc(AV[storefront.availability]?.[0] || storefront.availability)}` : "Не показывается: черновик, скрыт или нет цены"}</div></div>
    <div class="sec"><h2>Предложения</h2><div class="card tw"><table><thead><tr><th>Источник</th><th>Цена бутика</th><th>Закупка</th><th>Наличие</th><th>Проверено</th></tr></thead><tbody>
    ${(p.offers || []).map(of => `<tr><td>${esc(srcName(of.sourceId))}${p.pricing?.offerKey === of._key ? ' <span class="pill ok">основное</span>' : ""}${p.pricing?.conflict ? ` <button class="btn soft sm" data-primary="${esc(of._key)}">выбрать</button>` : ""}<div class="hint">${esc(of.region || "—")} · ${esc(of.currency || "—")}</div>${(of.errors || []).length ? `<div class="err hint">${esc(of.errors[of.errors.length - 1].text)}</div>` : ""}</td>
      <td class="num">${eur(of.boutique)}</td><td class="num">${eur(of.purchase)}</td>
      <td>${Object.values(of.availability || {}).slice(0, 8).map(a => `<span class="pill ${AV[a.status]?.[1] || ""}">${AV[a.status]?.[0] || a.status}</span>`).join(" ")}</td><td>${dt(of.checkedAt)}</td></tr>`).join("")}
    </tbody></table></div>
    ${p.pricing ? `<p class="hint">Правило ${esc(p.pricing.rule || "—")}${p.pricing.spread !== null && p.pricing.spread !== undefined ? " · разница с закупкой " + eur(p.pricing.spread) : ""}</p>` : ""}</div>
    <div class="sec"><h2>История</h2><div class="card pad hist">${(p.history || []).slice().reverse().map(h => `<div>${dt(h.at)} · <b>${esc(h.by)}</b> · ${esc(h.action)}${h.field ? " «" + esc({ title: "название", category: "категория", pinnedPrice: "цена", hidden: "скрыт", gender: "для кого", isNew: "новинка", stock: "в наличии", cover: "обложка", imageOrder: "порядок фото", primaryOffer: "основное предложение" }[h.field] || h.field) + "»" + (["imageOrder", "cover"].includes(h.field) ? " изменено" : ": " + esc(JSON.stringify(h.from)) + " → " + esc(JSON.stringify(h.to))) : ""}${h.to && !h.field ? " → " + esc(h.to) : ""}</div>`).join("") || "—"}</div></div></div>`;
  };
  draw();
  d.onclick = async e => {
    if (e.target === d || e.target.closest("[data-x]")) return close();
    const b = e.target.closest("button"); if (!b) return;
    const sw = (i, j) => { if (j < 0 || j >= order.length) return; [order[i], order[j]] = [order[j], order[i]]; draw(); };
    if (b.dataset.up) return sw(+b.dataset.up, +b.dataset.up - 1);
    if (b.dataset.dn) return sw(+b.dataset.dn, +b.dataset.dn + 1);
    if (b.dataset.cov) { cover = order[+b.dataset.cov]; return draw(); }
    if ("editcard" in b.dataset) { close(); return go("add:" + id); }
    if ("delp" in b.dataset) {
      if (!(await confirmBox("Удалить товар?", `«${o.title || p.title}» исчезнет из админки и с витрины. Это нельзя отменить.`))) return;
      try { await api("productDelete", { method: "POST", body: { ids: [id] } }); toast("Товар удалён"); close(); reload(); } catch (err) { toast(err.message); }
      return;
    }
    if (b.dataset.primary) { await api("productSave", { method: "POST", body: { id, changes: { primaryOffer: b.dataset.primary } } }); toast("Основное предложение выбрано"); close(); reload(); editor(id, reload); return; }
    if (b.dataset.st) { await api("status", { method: "POST", body: { ids: [id], status: b.dataset.st } }); toast(b.dataset.st === "published" ? "Опубликовано — на витрине через ~10 секунд" : "Снято с витрины"); close(); reload(); return; }
    if ("save" in b.dataset) {
      const changes = { title: $("#eTitle").value.trim() || null, category: $("#eCat").value || null, pinnedPrice: Number($("#ePin").value) || null, hidden: $("#eHide").checked || null,
        gender: $("#eG").value || null, isNew: $("#eNew").value || null, stock: $("#eSt").value ? { loc: $("#eSt").value, city: $("#eStCity").value.trim(), size: $("#eStSize").value.trim() } : (p.stock ? { loc: "" } : null) };
      if (cover !== cover0) changes.cover = cover;
      if (JSON.stringify(order) !== order0) changes.imageOrder = order;
      try { await api("productSave", { method: "POST", body: { id, changes } }); toast("Сохранено"); close(); reload(); } catch (err) { toast(err.message); }
    }
  };
  document.addEventListener("keydown", function esc_(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc_); } });
}

/* =====================================================================
   Общие инструменты: фото, выбор действия, всплывающая панель редактора
   ===================================================================== */
function fileToJpegB64(file, max = 1600) {
  return new Promise(async (ok, bad) => {
    try {
      const bmp = await createImageBitmap(file).catch(() => null);
      let w, h, src;
      if (bmp) { src = bmp; w = bmp.width; h = bmp.height; }
      else { const im = new Image(); im.src = URL.createObjectURL(file); await im.decode(); src = im; w = im.naturalWidth; h = im.naturalHeight; }
      const k = Math.min(1, max / Math.max(w, h)); const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(src, 0, 0, c.width, c.height);
      c.toBlob(b => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.readAsDataURL(b); }, "image/jpeg", 0.86);
    } catch (e) { bad(new Error("Не удалось прочитать фото: " + file.name)); }
  });
}
async function uploadPhoto(file, max) {
  const data = await fileToJpegB64(file, max);
  return (await api("imageUpload", { method: "POST", body: { data } })).url;
}
function pickFile(multiple = false) {
  return new Promise(res => { const i = document.createElement("input"); i.type = "file"; i.accept = "image/jpeg,image/png,image/webp,image/heic"; i.multiple = multiple; i.onchange = () => res([...i.files]); i.click(); });
}
/** Поле фото: превью + «Загрузить» / «Ссылка» / «Убрать». Значение хранится в data-url у .imgf. */
function imgFieldHTML(key, url, label = "Фото", hint = "") {
  return `<div class="imgf" data-imgf="${key}" data-url="${esc(url || "")}"><div class="f">${esc(label)}${hint ? ` <span class="hint" style="font-weight:400">${esc(hint)}</span>` : ""}</div>
    <div class="imgf-row"><div class="imgf-pv">${url ? `<img src="${esc(url)}" alt="">` : svg("img")}</div>
