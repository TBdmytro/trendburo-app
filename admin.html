<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="trendburo-build" content="2026-09-29-admin-v1">
<title>Trend Büro — Админка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f5f6;--card:#fff;--fg:#1f2125;--g2:#50545b;--muted:#8a8d93;--line:#e4e5e8;--soft:#f2f3f4;
  --ink:linear-gradient(180deg,#3d4046,#282a2e 52%,#1d1f22);--ok:#2f7d55;--warn:#a8671c;--err:#b3261e;--f:"Onest",-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #1f2125;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:5;background:#1f2125;color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;height:56px}
.top b{font-weight:700;letter-spacing:-.01em}
.top nav{display:flex;gap:4px;flex:1;overflow-x:auto}
.top nav button{border:0;background:none;color:rgba(255,255,255,.6);padding:8px 12px;border-radius:9px;white-space:nowrap}
.top nav button[aria-current=page]{background:rgba(255,255,255,.12);color:#fff}
.top .me{font-size:12.5px;color:rgba(255,255,255,.6)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 80px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:17px;margin:0}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:0;border-radius:10px;padding:9px 15px;background:var(--ink);color:#fff;font-weight:600}
.btn.soft{background:var(--soft);color:var(--fg);font-weight:500}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--g2);white-space:nowrap}
.pill.ok{background:#e4f2ea;color:var(--ok)}.pill.warn{background:#f8ecdc;color:var(--warn)}.pill.err{background:#f9e3e1;color:var(--err)}.pill.dark{background:#25272b;color:#fff}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px}
textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--g2)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--g2)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
ul.checks{margin:8px 0 0;padding-left:18px;color:var(--g2);font-size:12.5px}
ul.checks li{margin:3px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
.thumb{width:52px;height:64px;border-radius:8px;background:#f2f2f4;object-fit:contain;display:block}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;background:#25272b}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px}
.tabs button[aria-pressed=true]{background:#25272b;color:#fff;border-color:#25272b}
.issues{display:flex;gap:4px;flex-wrap:wrap;max-width:320px}
.drawer{position:fixed;inset:0;z-index:20;background:rgba(20,22,25,.35);display:flex;justify-content:flex-end}
.drawer .in{width:min(760px,100%);height:100%;overflow:auto;background:var(--bg);padding:22px}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgs figure{margin:0;width:110px;display:flex;flex-direction:column;gap:4px}
.imgs img{width:110px;height:136px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px}
.imgs figure.cover img{box-shadow:0 0 0 2px #25272b}
.imgs .ctl{display:flex;gap:3px}
.imgs .ctl button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11px;padding:3px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2125;color:#fff;padding:10px 16px;border-radius:99px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.login{max-width:360px;margin:12vh auto;display:flex;flex-direction:column;gap:12px}
.note{font-size:12.5px;color:var(--muted)}
.err{color:var(--err)}
.hist{font-size:12.5px;color:var(--g2);display:flex;flex-direction:column;gap:4px}
</style>
</head>
<body>
<section id="loginView" class="login card" hidden>
  <h1>Trend Büro</h1><p class="sub" style="margin:0">Вход в админку</p>
  <label class="f">Ваше имя (попадёт в историю правок)<input type="text" id="lgName" autocomplete="username"></label>
  <label class="f">Пароль<input type="password" id="lgPw" autocomplete="current-password"></label>
  <button class="btn" id="lgBtn">Войти</button><div class="err" id="lgErr"></div>
</section>

<div id="appView" hidden>
  <header class="top"><b>Trend Büro · Админка</b>
    <nav id="nav"><button data-v="sources">Источники</button><button data-v="import">Импорт</button><button data-v="jobs">Задачи</button><button data-v="products">Товары</button><button data-v="pricing">Цены</button></nav>
    <span class="me" id="meName"></span><button class="btn soft sm" id="logout">Выйти</button>
  </header>
  <main class="wrap" id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = n => n === null || n === undefined ? "—" : new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 }).format(n) + " €";
const dt = s => s ? new Date(s).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2600); }
async function api(a, { method = "GET", body, query = {} } = {}) {
  const u = "/api/admin?" + new URLSearchParams({ a, ...query });
  const r = await fetch(u, { method, credentials: "same-origin", headers: body ? { "Content-Type": "application/json", "X-TB": "1" } : { "X-TB": "1" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: "Ответ сервера не распознан" }));
  if (r.status === 401 && a !== "login") { showLogin(); throw new Error(j.error); }
  if (!r.ok) throw new Error(j.error || "Ошибка " + r.status);
  return j;
}
const KIND = { official: "Официальный сайт", "eyewear-supplier": "Поставщик очков", file: "Файл" };
const STATUS = { queued: ["В очереди", ""], running: ["Идёт", "dark"], waiting: ["Пауза перед повтором", "warn"], done: ["Готово", "ok"], failed: ["Ошибка", "err"], blocked: ["Источник блокирует", "err"], cancelled: ["Отменено", ""] };
const IKIND = { new: "Новые", update: "Обновления", duplicate: "Возможные дубли", incomplete: "Неполные", error: "Ошибки", excluded: "Исключены", pricechange: "Изменения цен" };
const CATS = { bags: "Сумки", shoes: "Обувь", clothing: "Одежда", eyewear: "Очки", accessories: "Аксессуары", jewelry: "Украшения", watches: "Часы", fragrance: "Ароматы", other: "Другое" };
const AV = { online: ["онлайн", "ok"], boutique: ["в бутике", "warn"], out: ["нет", "err"], preorder: ["предзаказ", "warn"], unknown: ["неизвестно", ""] };

let me = null, view = "sources", pollT = null;

function showLogin() { $("#appView").hidden = true; $("#loginView").hidden = false; }
$("#lgBtn").onclick = async () => {
  $("#lgErr").textContent = "";
  try { const r = await api("login", { method: "POST", body: { name: $("#lgName").value.trim() || "admin", password: $("#lgPw").value } }); me = r.name; start(); }
  catch (e) { $("#lgErr").textContent = e.message; }
};
$("#lgPw").addEventListener("keydown", e => { if (e.key === "Enter") $("#lgBtn").click(); });
$("#logout").onclick = async () => { await api("logout", { method: "POST", body: {} }).catch(() => {}); showLogin(); };
$("#nav").onclick = e => { const b = e.target.closest("[data-v]"); if (b) go(b.dataset.v); };

async function start() {
  try { const r = await api("me"); me = r.name; $("#meName").textContent = r.name + (r.demo ? " · ДЕМО-режим, данные не сохраняются" : ""); }
  catch { return; }
  $("#loginView").hidden = true; $("#appView").hidden = false; go(location.hash.slice(1) || "sources");
}
function go(v) {
  view = v; location.hash = v; clearTimeout(pollT);
  document.querySelectorAll("#nav button").forEach(b => b.dataset.v === v ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  ({ sources: vSources, import: vImport, jobs: vJobs, products: vProducts, pricing: vPricing })[v.split(":")[0]]?.(v.split(":")[1]);
}

/* ---------------- Источники ---------------- */
async function vSources() {
  const m = $("#main"); m.innerHTML = `<h1>Источники товаров</h1><p class="sub">Состояние подключения, регион, синхронизация, права на фото</p><div class="grid" id="srcGrid">Загрузка…</div>`;
  const { sources } = await api("sources");
  $("#srcGrid").innerHTML = sources.map(s => `
    <article class="card" data-id="${esc(s.id)}">
      <div class="row"><h2>${esc(s.name)}</h2><span class="pill">${esc(KIND[s.kind] || s.kind)}</span><span class="sp"></span>
        ${s.connected ? `<span class="pill ${s.lastSync?.status === "blocked" ? "err" : s.lastSync?.status === "done" ? "ok" : ""}">${s.lastSync ? esc(STATUS[s.lastSync.status]?.[0] || s.lastSync.status) : "Ещё не запускался"}</span>` : `<span class="pill err">Не подключён</span>`}</div>
      <dl class="kv" style="margin-top:10px">
        <dt>Регион / валюта</dt><dd>${esc(s.region || "—")} · ${esc(s.currency || "—")}</dd>
        <dt>Синхронизация</dt><dd>${s.lastSync ? dt(s.lastSync.at) + " · обработано " + s.lastSync.processed + ", ошибок " + s.lastSync.errors : "—"}${s.running ? ' <span class="pill dark">идёт задача</span>' : ""}</dd>
        <dt>Товаров</dt><dd class="num">найдено ${s.stats.found} · опубликовано ${s.stats.published}</dd>
        <dt>Категории</dt><dd>${s.categories.length ? s.categories.map(c => esc(CATS[c] || c)).join(", ") : "—"}</dd>
      </dl>
      <details style="margin-top:10px"><summary class="note">Что проверено и что блокирует</summary><ul class="checks">${s.checks.map(c => `<li>${esc(c)}</li>`).join("")}</ul></details>
      ${s.connected && s.adapter !== "file" ? `
      <div style="margin-top:12px;display:flex;flex-direction:column;gap:10px">
        <label class="row" style="gap:8px"><input type="checkbox" data-f="copy" ${s.photoCopy.allowed ? "checked" : ""}> Копирование фото разрешено</label>
        <label class="f">Основание (кто и когда разрешил)<input type="text" data-f="basis" value="${esc(s.photoCopy.basis || "")}" placeholder="Например: письмо от бренда, 29.09.2026"></label>
        <div class="note">Сейчас: ${s.imageRights === "copy-allowed" ? "фото сохраняются в наше хранилище" : "фото показываются по ссылке источника"}</div>
        <div class="row">
          <label class="f" style="flex:1">Обновление цен и наличия<select data-f="schedule">${["off", "daily", "weekly"].map(v => `<option value="${v}" ${s.schedule === v ? "selected" : ""}>${{ off: "Выключено", daily: "Раз в сутки", weekly: "Раз в неделю" }[v]}</option>`).join("")}</select></label>
          <label class="row" style="gap:6px;margin-top:18px"><input type="checkbox" data-f="autoUpdate" ${s.autoUpdate ? "checked" : ""}> применять обновления сразу</label>
        </div>
        <label class="row" style="gap:6px"><input type="checkbox" data-f="autoPublish" ${s.autoPublish ? "checked" : ""}> автопубликация новых товаров (кроме первого импорта)</label>
        ${s.adapter === "brand-site" ? `<label class="f">Sitemap для «весь каталог» (по одному в строке)<textarea data-f="sitemaps" style="min-height:60px">${esc(s.sitemaps.join("\n"))}</textarea></label>` : ""}
        <div class="row"><button class="btn sm" data-save>Сохранить</button><button class="btn soft sm" data-imp>Импорт…</button></div>
      </div>` : s.connected ? `<div class="row" style="margin-top:12px"><button class="btn soft sm" data-imp>Загрузить файл…</button></div>` : ""}
    </article>`).join("");
  $("#srcGrid").onclick = async e => {
    const card = e.target.closest("[data-id]"); if (!card) return;
    const id = card.dataset.id, f = k => card.querySelector(`[data-f=${k}]`);
    if (e.target.closest("[data-imp]")) return go("import:" + id);
    if (e.target.closest("[data-save]")) {
      try {
        await api("sourceSave", { method: "POST", body: { id, photoCopy: { allowed: f("copy").checked, basis: f("basis").value }, schedule: f("schedule").value, autoUpdate: f("autoUpdate").checked, autoPublish: f("autoPublish").checked, ...(f("sitemaps") ? { sitemaps: f("sitemaps").value.split(/\s+/).filter(Boolean) } : {}) } });
        toast("Сохранено"); vSources();
      } catch (err) { toast(err.message); }
    }
  };
}

/* ---------------- Импорт ---------------- */
async function vImport(pre) {
  const { sources } = await api("sources");
  const avail = sources.filter(s => s.connected);
  const m = $("#main");
  m.innerHTML = `<h1>Новый импорт</h1><p class="sub">Данные загружаются на сервере в фоне. Первый импорт попадает в предпросмотр — публикуете вы.</p>
  <div class="card" style="display:flex;flex-direction:column;gap:14px;max-width:820px">
    <label class="f">Источник<select id="iSrc">${avail.map(s => `<option value="${esc(s.id)}" ${s.id === pre ? "selected" : ""}>${esc(s.name)} · ${esc(s.region || "—")} ${esc(s.currency || "")}</option>`).join("")}</select></label>
    <div><div class="note" style="margin-bottom:6px">Что загружаем</div><div class="seg" id="iMode"></div></div>
    <div id="iBody"></div>
    <div class="row"><button class="btn" id="iGo">Запустить импорт</button><span class="note" id="iNote"></span></div>
  </div>`;
  const MODES = { "brand-site": [["link", "Один товар"], ["links", "Список ссылок"], ["category", "Категория"], ["full", "Весь каталог (sitemap)"]], shopify: [["link", "Один товар"], ["links", "Список ссылок"], ["category", "Разделы"], ["full", "Все разделы"]], file: [["file", "CSV / JSON"]] };
  let mode;
  const draw = () => {
    const s = avail.find(x => x.id === $("#iSrc").value); const ms = MODES[s.adapter] || [];
    if (!ms.some(x => x[0] === mode)) mode = ms[0][0];
    $("#iMode").innerHTML = ms.map(([k, v]) => `<button data-m="${k}" aria-pressed="${k === mode}">${v}</button>`).join("");
    const b = $("#iBody");
    if (mode === "link") b.innerHTML = `<label class="f">Ссылка на товар<input type="text" id="iIn" placeholder="https://…"></label>`;
    else if (mode === "links") b.innerHTML = `<label class="f">Ссылки на товары, по одной в строке<textarea id="iIn"></textarea></label>`;
    else if (mode === "category") b.innerHTML = s.adapter === "shopify"
      ? `<label class="f">Разделы (handle), по одному в строке — пусто = все настроенные<textarea id="iIn">${esc(s.collections.join("\n"))}</textarea></label>`
      : `<label class="f">Ссылка на категорию<input type="text" id="iIn" placeholder="https://…"></label><label class="f" style="margin-top:10px">Название категории для отчёта<input type="text" id="iCat" placeholder="Например: Сумки"></label><p class="note">Проходятся все страницы категории, пока появляются новые товары.</p>`;
    else if (mode === "full") b.innerHTML = `<p class="note">${s.adapter === "shopify" ? "Все настроенные разделы поставщика, все страницы." : "Все товары из sitemap региона " + esc(s.region) + ". Полнота зависит от sitemap источника — это будет видно в отчёте."}</p>`;
    else b.innerHTML = `<label class="f">Файл CSV или JSON<input type="file" id="iFile" accept=".csv,.json,.txt,text/csv,application/json"></label>
      <p class="note">Колонки: brand, title, model_sku, sku, gtin, color, size, material, category, gender, price (цена бутика), currency, purchase, availability, lead_days, images (через |), url</p>`;
  };
  $("#iSrc").onchange = draw; $("#iMode").onclick = e => { const b = e.target.closest("[data-m]"); if (b) { mode = b.dataset.m; draw(); } };
  draw();
  $("#iGo").onclick = async () => {
    const btn = $("#iGo"); btn.disabled = true; $("#iNote").textContent = "";
    try {
      let input = $("#iIn")?.value || "";
      if (mode === "file") { const f = $("#iFile").files[0]; if (!f) throw new Error("Выберите файл"); if (f.size > 4e6) throw new Error("Файл больше 4 МБ — разделите на части"); input = await f.text(); }
      const r = await api("jobCreate", { method: "POST", body: { sourceId: $("#iSrc").value, mode, input, category: $("#iCat")?.value || null } });
      toast(r.existing ? "Такая задача уже идёт — открыл её" : "Импорт запущен");
      go("jobs:" + r.job._id);
    } catch (e) { $("#iNote").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    btn.disabled = false;
  };
}

/* ---------------- Задачи ---------------- */
async function vJobs(openId) {
  const m = $("#main");
  const { jobs } = await api("jobs");
  const active = jobs.filter(j => ["queued", "running", "waiting"].includes(j.status));
  m.innerHTML = `<h1>Задачи импорта</h1><p class="sub">Импорт продолжается и после закрытия админки (фоновые запуски). Пока страница открыта, обработка идёт быстрее.</p>
  <div class="tw"><table><thead><tr><th>Создана</th><th>Источник</th><th>Режим</th><th>Статус</th><th>Прогресс</th><th>Ошибки</th><th></th></tr></thead><tbody>
  ${jobs.map(j => { const st = STATUS[j.status] || [j.status, ""]; const pct = j.found ? Math.round(j.processed / j.found * 100) : 0;
    return `<tr><td>${dt(j.createdAt)}<div class="note">${esc(j.createdBy)}</div></td><td>${esc(j.sourceId)}</td><td>${esc({ link: "товар", links: "ссылки", category: "категория", full: "весь каталог", file: "файл" }[j.mode] || j.mode)}${j.meta?.refresh ? ' <span class="pill">обновление</span>' : ""}</td>
    <td><span class="pill ${st[1]}">${st[0]}</span></td>
    <td class="num"><div class="bar"><i style="width:${pct}%"></i></div>${j.processed} из ${j.found}${j.phase === "discover" ? " · ищем товары…" : ""}</td>
    <td class="num">${j.errors.length}</td>
    <td class="row" style="gap:6px"><button class="btn sm" data-prev="${esc(j._id)}">Предпросмотр</button>${["queued", "running", "waiting"].includes(j.status) ? `<button class="btn soft sm" data-cancel="${esc(j._id)}">Отменить</button>` : ""}<button class="btn soft sm" data-cov="${esc(j._id)}">Отчёт</button></td></tr>`; }).join("") || `<tr><td colspan="7" class="note">Задач пока нет</td></tr>`}
  </tbody></table></div><div id="jobDetail" style="margin-top:18px"></div>`;
  m.onclick = async e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.prev) return preview(t.dataset.prev);
    if (t.dataset.cov) return coverage(jobs.find(j => j._id === t.dataset.cov));
    if (t.dataset.cancel) { await api("jobCancel", { method: "POST", body: { id: t.dataset.cancel } }); toast("Отмена отправлена"); vJobs(); }
    if (t.dataset.kind) { t.closest("#jobDetail").dataset.kind = t.dataset.kind; preview(t.closest("#jobDetail").dataset.job, t.dataset.kind); }
  };
  if (openId) preview(openId);
  if (active.length && view.startsWith("jobs")) { // пока открыто — двигаем очередь сами
    pollT = setTimeout(async () => { try { await api("tick", { method: "POST", body: {} }); } catch {} if (view.startsWith("jobs")) vJobs($("#jobDetail").dataset.job); }, 2500);
  }
}
function coverage(j) {
  const c = j.coverage || {}; const cats = Object.entries(c.categories || {});
  $("#jobDetail").innerHTML = `<div class="card"><h2>Отчёт покрытия</h2>
   <dl class="kv" style="margin-top:10px"><dt>Обход</dt><dd>${dt(c.startedAt)} — ${c.finishedAt ? dt(c.finishedAt) : "идёт"}</dd>
   <dt>Страниц / sitemap</dt><dd class="num">${c.pages || 0} / ${c.sitemaps || 0}</dd><dt>Найдено товаров</dt><dd class="num">${j.found}</dd><dt>Обработано</dt><dd class="num">${j.processed}</dd>
   <dt>Полнота</dt><dd>${c.complete ? '<span class="pill ok">подтверждена для выбранного объёма</span>' : '<span class="pill warn">не подтверждена</span>'} ${esc(c.note || "")}</dd></dl>
   ${cats.length ? `<table style="margin-top:12px"><thead><tr><th>Категория</th><th>Страниц</th><th>Товаров</th><th>Полностью</th></tr></thead><tbody>${cats.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v.pages}</td><td class="num">${v.items}</td><td>${v.complete ? "да" : "нет"}</td></tr>`).join("")}</tbody></table>` : ""}
   ${(c.unavailable || []).length ? `<h2 style="margin-top:14px;font-size:15px">Недоступно</h2><ul class="checks">${c.unavailable.map(u => `<li>${esc(u.url)} — ${esc(u.reason)}</li>`).join("")}</ul>` : ""}
   ${(c.excluded || []).length ? `<h2 style="margin-top:14px;font-size:15px">Исключено правилами</h2><ul class="checks">${c.excluded.slice(0, 50).map(u => `<li>${esc(u.url)} — ${esc(u.reason)}</li>`).join("")}</ul>` : ""}
   ${j.errors.length ? `<h2 style="margin-top:14px;font-size:15px">Ошибки</h2><ul class="checks">${j.errors.slice(0, 50).map(x => `<li>${esc(x.url)} — ${esc(x.text)}</li>`).join("")}</ul>` : ""}
   <p class="note" style="margin-top:12px">Это ассортимент выбранного источника и региона, а не мировой ассортимент бренда.</p></div>`;
}

async function preview(jobId, kind) {
  const box = $("#jobDetail"); box.dataset.job = jobId;
  const { items, counts } = await api("items", { query: { jobId } });
  if (box.dataset.shown !== jobId) { box.dataset.shown = jobId; delete box.dataset.kind; }
  kind = kind || box.dataset.kind || ["new", "update", "duplicate", "incomplete", "error", "excluded"].find(k => counts[k]) || "new";
  const pc = items.filter(i => i.kind === "update" && i.priceBefore !== null && i.priceBefore !== i.pricing.ua);
  counts.pricechange = pc.length;
  const list = kind === "pricechange" ? pc : items.filter(i => i.kind === kind);
  box.innerHTML = `<div class="card"><div class="row"><h2>Предпросмотр</h2><span class="sp"></span>
    <button class="btn soft sm" id="pDraft">В черновики</button><button class="btn sm" id="pPub">Опубликовать выбранные</button></div>
    <div class="tabs">${Object.keys(IKIND).map(k => `<button data-kind="${k}" aria-pressed="${k === kind}">${IKIND[k]} <span class="num">${counts[k] || 0}</span></button>`).join("")}</div>
    <div class="tw"><table><thead><tr><th><input type="checkbox" id="pAll" aria-label="Выбрать все"></th><th>Фото</th><th>Товар</th><th>Категория</th><th>Варианты</th><th>Цена источника</th><th>Наша цена</th><th>Проблемы</th></tr></thead><tbody>
    ${list.map(i => { const p = i.pricing; const photos = new Set([...i.model.images.map(x => x.url), ...i.variants.flatMap(v => v.images.map(x => x.url))]).size;
      return `<tr><td><input type="checkbox" data-sel="${esc(i._id)}" ${i.selected && !i.publishedAs ? "checked" : ""}></td>
      <td>${i.model.images[0] ? `<img class="thumb" loading="lazy" src="${esc(i.model.images[0].url)}" alt="">` : '<div class="thumb"></div>'}<div class="note num">${photos} фото</div></td>
      <td><b>${esc(i.model.brand || "—")}</b><div>${esc(i.model.title || "—")}</div><div class="note">${esc(i.model.sourceTitle || "")}</div><div class="note">${esc(i.model.modelSku || "")}</div>
        ${i.url ? `<a class="note" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">источник ↗</a>` : ""}${i.publishedAs ? ' <span class="pill ok">опубликовано</span>' : ""}
        ${i.kind === "duplicate" ? `<div style="margin-top:6px"><div class="note">${esc(i.match.by)}</div><select data-res="${esc(i._id)}"><option value="">Решение…</option><option value="new">Создать отдельный товар</option><option value="merge">Объединить с найденным</option></select></div>` : ""}</td>
      <td>${esc(CATS[i.model.category] || "не определена")}${i.model.gender ? `<div class="note">${{ w: "женское", m: "мужское", u: "унисекс" }[i.model.gender]}</div>` : ""}</td>
      <td class="num">${i.variants.length}<div class="note">${esc(i.variants.map(v => [v.color, v.size].filter(Boolean).join(" ")).filter(Boolean).slice(0, 4).join(", "))}</div>
        <div class="note">${Object.values(i.offer.availability || {}).map(a => AV[a.status]?.[0] || a.status).slice(0, 4).join(", ")}</div></td>
      <td class="num">${eur(p.boutique)}<div class="note">${esc(i.offer.region || "—")} · ${esc(i.offer.currency || "—")} · ${esc(i.offer.priceSource)}</div>${p.purchase ? `<div class="note">закупка ${eur(p.purchase)}</div>` : ""}</td>
      <td class="num"><b>${eur(p.ua)}</b>${p.eu !== p.ua ? `<div class="note">Европа/Дубай ${eur(p.eu)}</div>` : ""}<div class="note">правило ${esc(p.rule || "—")}</div>
        ${p.spread !== null && p.spread !== undefined ? `<div class="note">разница с закупкой ${eur(p.spread)}</div>` : ""}${i.priceBefore !== null && i.priceBefore !== p.ua ? `<div class="note">было ${eur(i.priceBefore)}</div>` : ""}</td>
      <td><div class="issues">${i.issues.map(x => `<span class="pill ${x.level === "error" ? "err" : x.level === "warn" ? "warn" : ""}" title="${esc(x.text)}">${esc(x.text)}</span>`).join("")}</div></td></tr>`; }).join("") || `<tr><td colspan="8" class="note">Нет позиций</td></tr>`}
    </tbody></table></div><div id="pRes" class="note" style="margin-top:10px"></div></div>`;
  $("#pAll").onchange = e => box.querySelectorAll("[data-sel]").forEach(c => c.checked = e.target.checked);
  const run = async status => {
    const ids = [...box.querySelectorAll("[data-sel]:checked")].map(c => c.dataset.sel);
    if (!ids.length) return toast("Ничего не выбрано");
    const resolution = {}; box.querySelectorAll("[data-res]").forEach(s => { if (s.value) resolution[s.dataset.res] = s.value; });
    const { results } = await api("publish", { method: "POST", body: { ids, status, resolution } });
    const ok = results.filter(r => r.ok).length, bad = results.filter(r => !r.ok);
    $("#pRes").innerHTML = `${status === "published" ? "Опубликовано" : "В черновиках"}: ${ok}. ${bad.length ? "Пропущено " + bad.length + ": " + bad.slice(0, 5).map(b => esc(b.reason)).join("; ") : ""}`;
    toast(`Готово: ${ok}`);
  };
  $("#pPub").onclick = () => run("published"); $("#pDraft").onclick = () => run("draft");
}

/* ---------------- Товары ---------------- */
async function vProducts() {
  const m = $("#main");
  m.innerHTML = `<h1>Товары</h1><p class="sub">Ручные правки хранятся отдельно от данных источника — синхронизация их не перезаписывает</p>
  <div class="row" style="margin-bottom:12px"><input type="text" id="pq" placeholder="Бренд, название, артикул" style="max-width:320px"><select id="pst" style="max-width:200px"><option value="">Все статусы</option><option value="published">Опубликованы</option><option value="draft">Черновики</option><option value="hidden">Скрыты</option></select></div>
  <div class="tw"><table><thead><tr><th></th><th>Товар</th><th>Категория</th><th>Статус</th><th>Цена</th><th>Обновлён</th></tr></thead><tbody id="plist"></tbody></table></div>`;
  const load = async () => {
    const { products, total } = await api("products", { query: { q: $("#pq").value, status: $("#pst").value } });
    $("#plist").innerHTML = products.map(p => `<tr data-open="${esc(p._id)}" style="cursor:pointer"><td>${p.cover ? `<img class="thumb" loading="lazy" src="${esc(p.cover)}" alt="">` : ""}</td>
      <td><b>${esc(p.brand)}</b><div>${esc(p.title)}</div>${p.issues ? `<span class="pill warn">${p.issues} замеч.</span>` : ""}</td><td>${esc(CATS[p.category] || "—")}</td>
      <td><span class="pill ${p.status === "published" ? "ok" : ""}">${esc({ published: "опубликован", draft: "черновик", hidden: "скрыт" }[p.status] || p.status)}</span>${p.hidden ? ' <span class="pill">скрыт вручную</span>' : ""}</td>
      <td class="num">${eur(p.price?.ua)}${p.price?.conflict ? ' <span class="pill warn">конфликт предложений</span>' : ""}</td><td>${dt(p.updatedAt)}</td></tr>`).join("") || `<tr><td colspan="6" class="note">Товаров нет. Запустите импорт.</td></tr>`;
    if (total > products.length) $("#plist").insertAdjacentHTML("beforeend", `<tr><td colspan="6" class="note">Показано ${products.length} из ${total} — уточните поиск</td></tr>`);
  };
  let t; $("#pq").oninput = () => { clearTimeout(t); t = setTimeout(load, 300); }; $("#pst").onchange = load;
  $("#plist").onclick = e => { const r = e.target.closest("[data-open]"); if (r) editor(r.dataset.open, load); };
  load();
}
async function editor(id, reload) {
  const { product: p, storefront } = await api("product", { query: { id } });
  const o = p.overrides || {};
  let order = (o.imageOrder && o.imageOrder.length ? o.imageOrder : p.images.map(i => i.sourceUrl || i.url));
  let cover = o.cover || order[0];
  const order0 = JSON.stringify(order), cover0 = cover;
  const d = document.createElement("div"); d.className = "drawer"; document.body.append(d);
  const close = () => d.remove();
  const draw = () => {
    const imgBy = new Map(p.images.map(i => [i.sourceUrl || i.url, i]));
    d.innerHTML = `<div class="in" role="dialog" aria-label="Товар"><div class="row"><h1 style="margin:0">${esc(p.brand)} · ${esc(o.title || p.title)}</h1><span class="sp"></span><button class="btn soft sm" data-x>Закрыть</button></div>
    <p class="note">${esc(p.sourceTitle || "")} · ${esc(p.modelSku || "без артикула")} ${p.sourceUrl ? `· <a href="${esc(p.sourceUrl)}" target="_blank" rel="noopener noreferrer">источник ↗</a>` : ""}</p>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="row"><label class="f" style="flex:2">Название на витрине<input type="text" id="eTitle" value="${esc(o.title || "")}" placeholder="${esc(p.title || "")}"></label>
      <label class="f" style="flex:1">Категория<select id="eCat"><option value="">${esc(CATS[p.category] || "как в источнике")} (источник)</option>${Object.entries(CATS).map(([k, v]) => `<option value="${k}" ${o.category === k ? "selected" : ""}>${v}</option>`).join("")}</select></label></div>
      <div class="row"><label class="f" style="flex:1">Закреплённая цена, € (пусто — по правилам)<input type="number" id="ePin" min="0" step="5" value="${esc(o.pinnedPrice || "")}"></label>
      <label class="row" style="gap:6px;margin-top:18px;flex:1"><input type="checkbox" id="eHide" ${o.hidden ? "checked" : ""}> Скрыть с витрины</label></div>
      <div><div class="note" style="margin-bottom:6px">Фото: порядок и обложка (${p.images.length}${p.images.length < 3 ? " — меньше трёх" : ""})</div>
      <div class="imgs">${order.map((u, i) => { const im = imgBy.get(u) || { url: u }; return `<figure class="${u === cover ? "cover" : ""}"><img src="${esc(im.url)}" alt="" loading="lazy"><div class="ctl"><button data-up="${i}" aria-label="Левее">←</button><button data-cov="${i}">${u === cover ? "обложка" : "сделать обложкой"}</button><button data-dn="${i}" aria-label="Правее">→</button></div><div class="note">${im.rights === "copied" ? "в нашем хранилище" : "по ссылке источника"}</div></figure>`; }).join("")}</div></div>
      <div class="row"><button class="btn" data-save>Сохранить правки</button>
        ${p.status === "published" ? `<button class="btn soft" data-st="draft">Снять с публикации</button>` : `<button class="btn soft" data-st="published">Опубликовать</button>`}</div>
    </div>
    <h2 style="margin:18px 0 8px">Предложения</h2>
    <div class="tw"><table><thead><tr><th>Источник</th><th>Регион</th><th>Цена бутика</th><th>Закупка</th><th>Срок</th><th>Наличие</th><th>Проверено</th><th>Ошибки</th></tr></thead><tbody>
    ${(p.offers || []).map(of => `<tr><td>${esc(of.sourceId)}${p.pricing?.offerKey === of._key ? ' <span class="pill ok">основное</span>' : ""}${p.pricing?.conflict ? ` <button class="btn soft sm" data-primary="${esc(of._key)}">выбрать</button>` : ""}</td><td>${esc(of.region || "—")} · ${esc(of.currency || "—")}${of.taxIncluded === true ? " · с НДС" : of.taxIncluded === false ? " · без НДС" : ""}</td>
      <td class="num">${eur(of.boutique)}</td><td class="num">${eur(of.purchase)}</td><td>${esc(of.supplierLeadDays ?? "—")}</td>
      <td>${Object.values(of.availability || {}).map(a => `<span class="pill ${AV[a.status]?.[1] || ""}">${AV[a.status]?.[0] || a.status}${a.stale ? " (устар.)" : ""}</span>`).join(" ")}</td><td>${dt(of.checkedAt)}</td><td>${(of.errors || []).map(e => esc(e.text)).join("<br>") || "—"}</td></tr>`).join("")}
    </tbody></table></div>
    ${p.pricing ? `<p class="note" style="margin-top:8px">Цена витрины: ${eur(p.pricing.ua)} (Украина) · ${eur(p.pricing.eu)} (Европа/Дубай) · правило ${esc(p.pricing.rule || "—")}${p.pricing.spread !== null && p.pricing.spread !== undefined ? " · разница с закупкой " + eur(p.pricing.spread) : ""}. ${esc((p.pricing.explain || []).slice(-1).join(""))}</p>` : ""}
    <h2 style="margin:18px 0 8px">На витрине</h2><p class="note">${storefront ? `Показывается: ${esc(storefront.title)}, ${eur(storefront.price.ua)}, наличие: ${esc(AV[storefront.availability]?.[0])}` : "Не показывается (черновик, скрыт или нет цены)"}</p>
    <h2 style="margin:18px 0 8px">История</h2><div class="hist">${(p.history || []).slice().reverse().map(h => `<div>${dt(h.at)} · <b>${esc(h.by)}</b> · ${esc(h.action)}${h.field ? " «" + esc({ title: "название", category: "категория", pinnedPrice: "цена", hidden: "скрыт", cover: "обложка", imageOrder: "порядок фото", primaryOffer: "основное предложение" }[h.field] || h.field) + "»" + (["imageOrder", "cover"].includes(h.field) ? " изменено" : ": " + esc(JSON.stringify(h.from)) + " → " + esc(JSON.stringify(h.to))) : ""}${h.to && !h.field ? " → " + esc(h.to) : ""}</div>`).join("") || "—"}</div></div>`;
  };
  draw();
  d.onclick = async e => {
    if (e.target === d || e.target.closest("[data-x]")) return close();
    const b = e.target.closest("button"); if (!b) return;
    const sw = (i, j) => { if (j < 0 || j >= order.length) return; [order[i], order[j]] = [order[j], order[i]]; draw(); };
    if (b.dataset.up) return sw(+b.dataset.up, +b.dataset.up - 1);
    if (b.dataset.dn) return sw(+b.dataset.dn, +b.dataset.dn + 1);
    if (b.dataset.cov) { cover = order[+b.dataset.cov]; return draw(); }
    if (b.dataset.primary) { await api("productSave", { method: "POST", body: { id, changes: { primaryOffer: b.dataset.primary } } }); toast("Основное предложение выбрано"); close(); reload(); editor(id, reload); return; }
    if (b.dataset.st) { await api("status", { method: "POST", body: { ids: [id], status: b.dataset.st } }); toast("Статус изменён"); close(); reload(); return; }
    if ("save" in b.dataset) {
      const changes = { title: $("#eTitle").value.trim() || null, category: $("#eCat").value || null, pinnedPrice: Number($("#ePin").value) || null, hidden: $("#eHide").checked || null };
      if (cover !== cover0) changes.cover = cover;
      if (JSON.stringify(order) !== order0) changes.imageOrder = order;
      try { await api("productSave", { method: "POST", body: { id, changes } }); toast("Сохранено"); close(); reload(); } catch (err) { toast(err.message); }
    }
  };
}

/* ---------------- Цены ---------------- */
async function vPricing() {
  const { config } = await api("pricing");
  const m = $("#main"); let previewed = false;
  const n = (id, v, step = "0.01") => `<input type="number" id="${id}" step="${step}" value="${esc(v)}">`;
  m.innerHTML = `<h1>Правила цен</h1><p class="sub">Изменение правил применяется только после предпросмотра. Итоговые цены кратны 5 €.</p>
  <div class="grid">
   <div class="card" style="display:flex;flex-direction:column;gap:10px"><h2>А. Официальные сайты</h2>
     <label class="f">Украина (доставка внутри), наценка ${n("cUa", config.official.markup.ua)}</label>
     <label class="f">Европа, наценка ${n("cEu", config.official.markup.eu)}</label>
     <label class="f">Дубай, наценка ${n("cDxb", config.official.markup.dxb)}</label>
     <label class="f">Округление<select id="cRound">${[["nearest", "до ближайших 5 € (середина вверх) — предположение"], ["up", "всегда вверх"], ["down", "всегда вниз"]].map(([k, v]) => `<option value="${k}" ${config.rounding === k ? "selected" : ""}>${v}</option>`).join("")}</select></label></div>
   <div class="card" style="display:flex;flex-direction:column;gap:10px"><h2>Б и В. Очки поставщиков</h2>
     <label class="f">Порог большой скидки поставщика (доля) ${n("cThr", config.eyewear.bigDiscountThreshold)}</label>
     <label class="f">Граница цены бутика, € ${n("cCap", config.eyewear.capBoutique, "1")}</label>
     <label class="f">Надбавка до границы, € ${n("cFlat", config.eyewear.flatAdd, "1")}</label>
     <label class="f">Надбавка выше границы (доля, округляется до 5 €) ${n("cPct", config.eyewear.pctAdd)}</label>
     <label class="f">Скидка клиенту в правиле Б (доля) ${n("cDisc", config.eyewear.clientDiscount)}</label>
     <label class="f">Правило В: множители ${n("cSm", config.eyewear.smallMarkup)} ${n("cSf", config.eyewear.smallFactor)}</label></div>
  </div>
  <div class="row" style="margin:14px 0"><button class="btn soft" id="cPrev">Предпросмотр расчётов</button><button class="btn" id="cSave" disabled>Сохранить правила</button></div>
  <div id="cOut"></div>`;
  const read = () => ({ rounding: $("#cRound").value, official: { markup: { ua: +$("#cUa").value, eu: +$("#cEu").value, dxb: +$("#cDxb").value } },
    eyewear: { bigDiscountThreshold: +$("#cThr").value, capBoutique: +$("#cCap").value, flatAdd: +$("#cFlat").value, pctAdd: +$("#cPct").value, clientDiscount: +$("#cDisc").value, smallMarkup: +$("#cSm").value, smallFactor: +$("#cSf").value } });
  m.oninput = e => { if (e.target.closest(".card")) { previewed = false; $("#cSave").disabled = true; } };
  $("#cPrev").onclick = async () => {
    const { results, changes } = await api("pricingPreview", { method: "POST", body: { config: read() } });
    $("#cOut").innerHTML = `<div class="tw"><table><thead><tr><th>Тип</th><th>Цена бутика</th><th>Закупка</th><th>Правило</th><th>Шаги</th><th>Итог</th><th>Разница с закупкой</th><th>Замечания</th></tr></thead><tbody>
      ${results.map(r => `<tr><td>${esc(KIND[r.input.kind] || r.input.kind)}${r.input.dest ? " · " + esc(r.input.dest) : ""}</td><td class="num">${eur(r.input.boutique)}</td><td class="num">${eur(r.input.purchase)}</td><td>${esc(r.rule)}</td>
      <td class="note">${r.steps.map(s => esc(s.label) + ": " + eur(Math.round(s.value * 100) / 100)).join("<br>")}</td><td class="num"><b>${eur(r.final)}</b></td><td class="num">${eur(r.spread)}</td><td>${r.reasons.map(x => `<span class="pill ${r.blocked ? "err" : "warn"}">${esc(x)}</span>`).join(" ")}</td></tr>`).join("")}
      </tbody></table></div>
      <h2 style="margin:16px 0 8px">Изменятся цены опубликованных товаров: ${changes.length}</h2>
      ${changes.length ? `<div class="tw"><table><thead><tr><th>Товар</th><th>Было</th><th>Станет</th></tr></thead><tbody>${changes.map(c => `<tr><td>${esc(c.brand)} · ${esc(c.title)}</td><td class="num">${eur(c.before)}</td><td class="num">${eur(c.after)}</td></tr>`).join("")}</tbody></table></div>` : ""}`;
    previewed = true; $("#cSave").disabled = false;
  };
  $("#cSave").onclick = async () => {
    if (!previewed) return;
    try { const r = await api("pricingSave", { method: "POST", body: { config: read(), confirmPreview: true } }); toast("Правила сохранены, пересчитано: " + r.updated); } catch (e) { toast(e.message); }
  };
}

start();
