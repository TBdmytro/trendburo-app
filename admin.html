<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="trendburo-build" content="2026-09-29-admin-v5">
<title>Trend Büro — Каталог</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Prata&display=swap">
<style>
:root{
  --bg:#f6f6f7;--card:#fff;--fg:#1c1d20;--g2:#4d5058;--muted:#8b8e95;--line:#ebebee;--soft:#f1f1f3;--soft2:#e8e8eb;
  --side:#1c1d20;--side2:#26282c;--ink:#1c1d20;--ink-g:linear-gradient(180deg,#3a3d43,#232529 55%,#1a1b1e);
  --ok:#2e7d52;--ok-bg:#e6f3ec;--warn:#9a5f16;--warn-bg:#f8eedf;--err:#b3261e;--err-bg:#fbe7e5;
  --r:16px;--f:"Onest",-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Prata",Georgia,serif;
  --sh:0 1px 2px rgba(20,21,24,.04),0 6px 24px rgba(20,21,24,.05);
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Каркас ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100%;background:linear-gradient(90deg,var(--side) 248px,var(--bg) 248px)}
.side{background:var(--side);color:#fff;display:flex;flex-direction:column;padding:22px 14px 16px;position:sticky;top:0;height:100vh}
.logo{padding:4px 10px 22px}
.logo b{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.01em;display:block}
.logo span{font-size:11.5px;color:rgba(255,255,255,.5);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:rgba(255,255,255,.62);padding:10px 12px;border-radius:11px;text-align:left;font-weight:500;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current=page]{background:rgba(255,255,255,.1);color:#fff}
.nav .cnt{margin-left:auto;font-size:11.5px;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:99px}
.pump{margin-top:auto;background:var(--side2);border-radius:14px;padding:12px;font-size:12.5px;color:rgba(255,255,255,.75)}
.pump b{color:#fff;font-weight:600}
.pump .bar{margin-top:8px;background:rgba(255,255,255,.12)}
.pump .bar i{background:#fff}
.who{display:flex;align-items:center;gap:10px;padding:12px 8px 0;margin-top:12px;border-top:1px solid rgba(255,255,255,.08);font-size:13px;color:rgba(255,255,255,.7)}
.who .av{width:30px;height:30px;border-radius:50%;background:#3a3d43;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px}
.who button{margin-left:auto;border:0;background:none;color:rgba(255,255,255,.5);font-size:12.5px}
.who button:hover{color:#fff}
.main{min-width:0;padding:30px 36px 110px}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-size:28px;line-height:1.15;margin:0;letter-spacing:-.025em;font-weight:700}
.head p{margin:6px 0 0;color:var(--muted)}
.head .sp{flex:1}

/* ---------- Элементы ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:20px}
.sec{margin-top:30px}
.sec>h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.sec>h2 small{font-size:13px;color:var(--muted);font-weight:400}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;background:var(--ink-g);color:#fff;font-weight:600;white-space:nowrap;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.soft{background:var(--soft);color:var(--fg);font-weight:500}
.btn.soft:hover{background:var(--soft2)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg);font-weight:500}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.lg{padding:14px 22px;font-size:15px;border-radius:14px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--g2);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.err{background:var(--err-bg);color:var(--err)}.pill.dark{background:var(--ink);color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.run .dot{animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:#b9bbc1;box-shadow:0 0 0 3px rgba(28,29,32,.06)}
textarea{min-height:120px;resize:vertical;font-size:13px;line-height:1.55}
label.f{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--g2);font-weight:500}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.err{color:var(--err)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:10px;color:var(--g2);font-weight:500}
.seg button[aria-pressed=true]{background:#fff;color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.chip:hover{border-color:#c9cbd0}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .c{font-size:11.5px;opacity:.6}
.bar{height:6px;border-radius:3px;background:var(--soft2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .4s}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px}
.toggle input{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--soft2);position:relative;transition:background .2s;flex:none;cursor:pointer;margin:0}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.toggle input:checked{background:var(--ink)}
.toggle input:checked::after{transform:translateX(16px)}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.note-box{display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:var(--soft);font-size:13.5px;line-height:1.5}
.note-box.err{background:var(--err-bg);color:#5c1612}.note-box.warn{background:var(--warn-bg);color:#4d3009}.note-box.ok{background:var(--ok-bg);color:#123d25}
.note-box svg{margin-top:1px}

/* ---------- Обзор ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:18px 20px}
.stat span{color:var(--muted);font-size:13px}
.stat b{display:block;font-size:30px;letter-spacing:-.03em;margin-top:6px;font-weight:600}
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.brand{padding:20px;display:flex;flex-direction:column;gap:14px}
.wm{font-family:var(--serif);font-size:19px;letter-spacing:.14em;text-transform:uppercase;line-height:1.2}
.brand .meta{font-size:12.5px;color:var(--muted)}
.brand .nums{display:flex;gap:18px;font-size:13px;color:var(--g2)}
.brand .nums b{font-size:18px;color:var(--fg);display:block;font-weight:600}
.brand .acts{display:flex;gap:8px;margin-top:auto}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li:hover{background:#fafafb}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600}
.li .t span{font-size:12.5px;color:var(--muted)}
.li .pr{width:150px}

/* ---------- Мастер загрузки ---------- */
.steps{display:flex;flex-direction:column;gap:14px;max-width:920px}
.step{padding:22px}
.step h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:10px}
.step h3 i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:grid;place-items:center}
.step>.hint{margin:0 0 16px 34px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.pick button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:all .15s}
.pick button:hover{border-color:#c9cbd0}
.pick button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pick .wm{font-size:15px}
.pick small{color:var(--muted);font-size:12px}
.sub-g{display:flex;flex-direction:column;gap:14px;margin-left:34px}
.summary{display:flex;align-items:center;gap:16px;padding:20px 22px;flex-wrap:wrap}
.summary .t{flex:1;min-width:240px}
.summary .t b{display:block;font-size:15px}
.summary .t span{font-size:13px;color:var(--muted)}

/* ---------- Задача и предпросмотр ---------- */
.jhead{padding:22px;display:flex;flex-direction:column;gap:16px}
.jstats{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.jstats div{background:#fff;padding:12px 14px}
.jstats span{font-size:12px;color:var(--muted)}
.jstats b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin:22px 0 14px}
.tabs button{border:0;background:none;border-radius:99px;padding:8px 14px;font-weight:500;color:var(--g2);white-space:nowrap}
.tabs button:hover{background:var(--soft)}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.tabs .c{opacity:.6;margin-left:4px;font-size:12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pc{position:relative;display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.pc.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),var(--sh)}
.pc .ph{aspect-ratio:4/5;background:#f4f4f5;display:grid;place-items:center;position:relative}
.pc .ph img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.pc .ph .n{position:absolute;right:10px;bottom:10px;font-size:11px;background:rgba(255,255,255,.9);padding:2px 8px;border-radius:99px;color:var(--g2)}
.pc .ck{position:absolute;left:10px;top:10px;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.95);border:1px solid var(--line);display:grid;place-items:center;z-index:2}
.pc .ck input{width:16px;height:16px;margin:0;accent-color:#1c1d20;cursor:pointer}
.pc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .br{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pc .tt{font-weight:600;line-height:1.3}
.pc .sz{display:flex;gap:4px;flex-wrap:wrap}
.pc .sz span{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--g2)}
.pc .sz span.no{color:#bbb;text-decoration:line-through}
.pc .prc{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:6px}
.pc .prc b{font-size:16px}
.pc .prc s{color:var(--muted);font-size:12px;text-decoration:none}
.pc .iss{display:flex;gap:4px;flex-wrap:wrap}
.pc .iss .pill{font-size:11px;padding:2px 8px;font-weight:500}
.pc select{padding:7px 10px;font-size:12.5px}
.actbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:18px;padding:10px 10px 10px 20px;display:flex;align-items:center;gap:10px;z-index:30;box-shadow:0 12px 40px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.actbar .btn.soft{background:rgba(255,255,255,.12);color:#fff}
.actbar .btn.pub{background:#fff;color:var(--ink)}
.more{display:flex;justify-content:center;margin-top:18px}

/* ---------- Новый товар ---------- */
.addg{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.addf{padding:22px;display:flex;flex-direction:column;gap:20px}
.addf h3{margin:0;font-size:15px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{position:relative;aspect-ratio:4/5;border:1.5px dashed #d3d4d8;border-radius:14px;background:#fafafb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12.5px;cursor:pointer;overflow:hidden;transition:border-color .15s,background .15s}
.slot:hover,.slot.over{border-color:var(--ink);background:#f3f3f5}
.slot.has{border-style:solid;border-color:var(--line);background:#f4f4f5;cursor:default}
.slot img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.slot .tag{position:absolute;left:8px;top:8px;font-size:11px;background:var(--ink);color:#fff;padding:2px 8px;border-radius:99px}
.slot .ctl{position:absolute;right:6px;bottom:6px;display:flex;gap:4px}
.slot .ctl button{width:28px;height:28px;border-radius:8px;border:0;background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(0,0,0,.12);font-size:13px}
.slot .busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.7)}
.prev{position:sticky;top:24px}
.prev .pv{overflow:hidden}
.prev .ph{aspect-ratio:4/5;background:linear-gradient(180deg,#f7f7f8,#efeff1);display:grid;place-items:center}
.prev .ph img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.prev .dots{display:flex;gap:5px;justify-content:center;padding:10px 0 0}
.prev .dots i{width:6px;height:6px;border-radius:50%;background:#d6d7db}.prev .dots i.on{background:var(--ink)}
.prev .bd{padding:14px 18px 18px;display:flex;flex-direction:column;gap:4px}
.prev .bd .br{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.prev .bd .tt{font-size:17px;font-weight:600;letter-spacing:-.01em}
.prev .bd .pr{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.prev .bd .dl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--g2)}
@media (max-width:1100px){.addg{grid-template-columns:1fr}.prev{position:static}}

/* ---------- Товары ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{max-width:340px}
.status-tag{position:absolute;left:10px;top:10px}

/* ---------- Карточка товара (панель) ---------- */
.drawer{position:fixed;inset:0;z-index:40;background:rgba(20,21,24,.36);display:flex;justify-content:flex-end;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.drawer .in{width:min(780px,100%);height:100%;overflow:auto;background:var(--bg);padding:26px;animation:sl .25s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{transform:translateX(40px)}}
.imgs{display:flex;gap:10px;flex-wrap:wrap}
.imgs figure{margin:0;width:118px;display:flex;flex-direction:column;gap:5px}
.imgs img{width:118px;height:146px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:12px}
.imgs figure.cover img{box-shadow:0 0 0 2px var(--ink)}
.imgs .ctl{display:flex;gap:3px}
.imgs .ctl button{flex:1;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:11px;padding:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.hist{font-size:12.5px;color:var(--g2);display:flex;flex-direction:column;gap:5px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;z-index:60;opacity:0;transition:all .2s;pointer-events:none;font-weight:500}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Вход ---------- */
.login-wrap{min-height:100%;display:grid;place-items:center;padding:20px;background:var(--side)}
.login{width:min(380px,100%);padding:30px;display:flex;flex-direction:column;gap:14px}
.login .wm{font-size:24px;letter-spacing:.02em;text-transform:none}

/* ---------- Мобильная версия ---------- */
@media (max-width:900px){
  .shell{grid-template-columns:1fr;background:var(--bg)}
  .actbar{left:12px;right:12px;transform:none;max-width:none;padding:8px 8px 8px 14px;gap:6px;bottom:12px}
  .actbar>span{font-size:12.5px;flex:1}
  .actbar .btn.sm{padding:7px 10px;font-size:12.5px}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:8px}
  .logo{padding:0 6px 0 4px}.logo span{display:none}.logo b{font-size:18px}
  .nav{flex-direction:row;overflow-x:auto;flex:1;scrollbar-width:none}
  .nav button{padding:8px 11px;white-space:nowrap}.nav button svg{display:none}
  .pump,.who{display:none}
  .main{padding:22px 16px 110px}
  .head h1{font-size:23px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .jstats{grid-template-columns:repeat(3,1fr)}
  .sub-g,.step>.hint{margin-left:0}
  .pgrid{grid-template-columns:repeat(2,1fr);gap:10px}
  .li .pr{display:none}
}
</style>
</head>
<body>
<div id="loginView" class="login-wrap" hidden>
  <div class="login card">
    <div><div class="wm">Trend Büro</div><div class="hint" style="margin-top:4px">Управление каталогом</div></div>
    <label class="f">Ваше имя<input type="text" id="lgName" autocomplete="username" placeholder="Будет в истории правок"></label>
    <label class="f">Пароль<input type="password" id="lgPw" autocomplete="current-password"></label>
    <button class="btn lg" id="lgBtn">Войти</button><div class="err" id="lgErr"></div>
  </div>
</div>

<div id="appView" class="shell" hidden>
  <aside class="side">
    <div class="logo"><b>Trend Büro</b><span>Каталог</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="pump" id="pump" hidden></div>
    <div class="who"><span class="av" id="meAv"></span><span id="meName"></span><button id="logout">Выйти</button></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = n => n === null || n === undefined ? "—" : new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 }).format(n) + " €";
const dt = s => s ? new Date(s).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";

/* ---------- Фоновая обработка: пока админка открыта, очередь двигается на любой вкладке ---------- */
async function pump() {
  if (pumpOn) return; pumpOn = true;
  try {
    while (true) {
      let jobs; try { jobs = (await api("jobs")).jobs; } catch { break; }
      const act = jobs.filter(j => ACTIVE.includes(j.status)); pumpActive = act.length;
      const cnt = $("#jobCnt"); if (cnt) { cnt.hidden = !act.length; cnt.textContent = act.length; }
      const p = $("#pump");
      if (!act.length) { p.hidden = true; break; }
      const j = act[0], pct = j.found ? Math.round(j.processed / j.found * 100) : 0;
      p.hidden = false;
      p.innerHTML = `<b>${esc(srcName(j.sourceId))}</b> · ${esc(STATUS[j.status][0].toLowerCase())}<div>${j.phase === "discover" ? "ищем товары… найдено " + j.found : `${j.processed} из ${j.found}`}</div><div class="bar"><i style="width:${j.phase === "discover" ? 8 : pct}%"></i></div>`;
      if (view === "job:" + j._id || view === "jobs") refreshCurrent();
      try { await api("tick", { method: "POST", body: {} }); } catch {}
      await new Promise(r => setTimeout(r, 1200));
    }
  } finally { pumpOn = false; }
  if (view === "jobs" || view.startsWith("job:")) refreshCurrent(true);
}
let refreshT = 0;
function refreshCurrent(force) { const now = Date.now(); if (!force && now - refreshT < 2500) return; refreshT = now; if (view === "jobs") vJobs(true); else if (view.startsWith("job:")) vJob(view.split(":")[1], true); }

    shopify: [["collections", "Разделы поставщика"], ["links", "Ссылки на товары"], ["full", "Все разделы"]],
    file: [["file", "Файл CSV"]]
  };

    const s = src.find(x => x.id === W.src);

    $("#main").innerHTML = head("Загрузка товаров", "Товары загружаются на сервере в фоне и попадают в предпросмотр. На витрину — только после вашей проверки.") + `

      <section class="card step"><h3><i>1</i>Откуда загружаем</h3><p class="hint">Бренд или поставщик</p>

      </section>
      ${s ? `<section class="card step"><h3><i>2</i>Что загрузить</h3><p class="hint">${s.adapter === "file" ? "Файл из Excel / Google Таблиц в формате CSV" : "Размеры, цвета, наличие и фото берём со страницы каждого товара"}</p>
        <div class="sub-g"><div class="seg" id="wMode">${ms.map(([k, v]) => `<button data-mode="${k}" aria-pressed="${k === W.mode}">${v}</button>`).join("")}</div><div id="wBody"></div></div>
        ${s.check && s.check.state === "blocked" ? `<div class="note-box err" style="margin:14px 0 0 34px">${svg("warn")}<div>Последняя проверка: сайт не пускает автоматическую загрузку с нашего сервера. Загрузка, скорее всего, остановится. Надёжный способ — файл CSV.</div></div>` : ""}
      </section>
      <section class="card summary" id="wSum"></section>` : ""}
    </div>`;
    if (s) body(s);
  };
  const body = s => {
    const b = $("#wBody");
    if (W.mode === "cats") b.innerHTML = `
      <div class="chips" id="wCats">${LOADCATS.map(c => `<button class="chip" data-cat="${c}" aria-pressed="${W.cats.has(c)}">${CATS[c]}</button>`).join("")}</div>
      <div class="seg" id="wG">${[["", "Женское и мужское"], ["w", "Женское"], ["m", "Мужское"]].map(([k, v]) => `<button data-g="${k}" aria-pressed="${W.gender === k}">${v}</button>`).join("")}</div>

      <div><div class="f" style="margin-bottom:8px">Фото — порядок и обложка <span class="hint" style="font-weight:400">${(p.images || []).length}${(p.images || []).length < 3 ? ", меньше трёх" : ""}</span></div>
      <div class="imgs">${order.map((u, i) => { const im = imgBy.get(u) || { url: u }; return `<figure class="${u === cover ? "cover" : ""}"><img src="${esc(im.url)}" alt="" loading="lazy"><div class="ctl"><button data-up="${i}" aria-label="Левее">←</button><button data-cov="${i}">${u === cover ? "обложка" : "обложкой"}</button><button data-dn="${i}" aria-label="Правее">→</button></div></figure>`; }).join("")}</div></div>
      <div class="row"><button class="btn" data-save>Сохранить</button>${p.manual ? `<button class="btn ghost" data-editcard>Изменить фото, цену, размеры</button>` : ""}
        ${p.status === "published" ? `<button class="btn ghost" data-st="draft">Снять с витрины</button>` : `<button class="btn ghost" data-st="published">Опубликовать</button>`}</div>
    </div>
    <div class="sec"><h2>На витрине</h2><div class="card pad hint">${storefront ? `Показывается как «${esc(storefront.title)}» · ${eur(storefront.price.ua)} Украина · ${eur(storefront.price.eu)} Европа/Дубай · наличие: ${esc(AV[storefront.availability]?.[0] || storefront.availability)}` : "Не показывается: черновик, скрыт или нет цены"}</div></div>
    <div class="sec"><h2>Предложения</h2><div class="card tw"><table><thead><tr><th>Источник</th><th>Цена бутика</th><th>Закупка</th><th>Наличие</th><th>Проверено</th></tr></thead><tbody>
    ${(p.offers || []).map(of => `<tr><td>${esc(srcName(of.sourceId))}${p.pricing?.offerKey === of._key ? ' <span class="pill ok">основное</span>' : ""}${p.pricing?.conflict ? ` <button class="btn soft sm" data-primary="${esc(of._key)}">выбрать</button>` : ""}<div class="hint">${esc(of.region || "—")} · ${esc(of.currency || "—")}</div>${(of.errors || []).length ? `<div class="err hint">${esc(of.errors[of.errors.length - 1].text)}</div>` : ""}</td>
      <td class="num">${eur(of.boutique)}</td><td class="num">${eur(of.purchase)}</td>
      <td>${Object.values(of.availability || {}).slice(0, 8).map(a => `<span class="pill ${AV[a.status]?.[1] || ""}">${AV[a.status]?.[0] || a.status}</span>`).join(" ")}</td><td>${dt(of.checkedAt)}</td></tr>`).join("")}
    </tbody></table></div>
    ${p.pricing ? `<p class="hint">Правило ${esc(p.pricing.rule || "—")}${p.pricing.spread !== null && p.pricing.spread !== undefined ? " · разница с закупкой " + eur(p.pricing.spread) : ""}</p>` : ""}</div>
    <div class="sec"><h2>История</h2><div class="card pad hist">${(p.history || []).slice().reverse().map(h => `<div>${dt(h.at)} · <b>${esc(h.by)}</b> · ${esc(h.action)}${h.field ? " «" + esc({ title: "название", category: "категория", pinnedPrice: "цена", hidden: "скрыт", cover: "обложка", imageOrder: "порядок фото", primaryOffer: "основное предложение" }[h.field] || h.field) + "»" + (["imageOrder", "cover"].includes(h.field) ? " изменено" : ": " + esc(JSON.stringify(h.from)) + " → " + esc(JSON.stringify(h.to))) : ""}${h.to && !h.field ? " → " + esc(h.to) : ""}</div>`).join("") || "—"}</div></div></div>`;
  };
  draw();
  d.onclick = async e => {
    if (e.target === d || e.target.closest("[data-x]")) return close();
    const b = e.target.closest("button"); if (!b) return;
    const sw = (i, j) => { if (j < 0 || j >= order.length) return; [order[i], order[j]] = [order[j], order[i]]; draw(); };
    if (b.dataset.up) return sw(+b.dataset.up, +b.dataset.up - 1);
    if (b.dataset.dn) return sw(+b.dataset.dn, +b.dataset.dn + 1);
    if (b.dataset.cov) { cover = order[+b.dataset.cov]; return draw(); }
    if ("editcard" in b.dataset) { close(); return go("add:" + id); }
    if (b.dataset.primary) { await api("productSave", { method: "POST", body: { id, changes: { primaryOffer: b.dataset.primary } } }); toast("Основное предложение выбрано"); close(); reload(); editor(id, reload); return; }
    if (b.dataset.st) { await api("status", { method: "POST", body: { ids: [id], status: b.dataset.st } }); toast(b.dataset.st === "published" ? "Опубликовано" : "Снято с витрины"); close(); reload(); return; }
    if ("save" in b.dataset) {
      const changes = { title: $("#eTitle").value.trim() || null, category: $("#eCat").value || null, pinnedPrice: Number($("#ePin").value) || null, hidden: $("#eHide").checked || null };
      if (cover !== cover0) changes.cover = cover;
      if (JSON.stringify(order) !== order0) changes.imageOrder = order;
      try { await api("productSave", { method: "POST", body: { id, changes } }); toast("Сохранено"); close(); reload(); } catch (err) { toast(err.message); }
    }
  };
  document.addEventListener("keydown", function esc_(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc_); } });
}

/* ---------- Цены ---------- */
async function vPrices() {
  const { config } = await api("pricing");
  let previewed = false;
  const n = (id, v, step = "0.01") => `<input type="number" id="${id}" step="${step}" value="${esc(v)}">`;
  $("#main").innerHTML = head("Правила цен", "Клиент видит только итоговую цену. Новые правила сохраняются после просмотра расчётов.") + `
  <div class="brands" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))">
   <div class="card pad" style="display:flex;flex-direction:column;gap:14px"><h2 style="margin:0;font-size:16px">Официальные сайты брендов</h2>
     <label class="f">Украина — наценка (доставка включена) ${n("cUa", config.official.markup.ua)}</label>
     <label class="f">Европа — наценка (+ доставка) ${n("cEu", config.official.markup.eu)}</label>
     <label class="f">Дубай — наценка (+ доставка) ${n("cDxb", config.official.markup.dxb)}</label>
     <label class="f">Округление до 5 €<select id="cRound">${[["nearest", "до ближайших (середина вверх)"], ["up", "всегда вверх"], ["down", "всегда вниз"]].map(([k, v]) => `<option value="${k}" ${config.rounding === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
     <p class="hint" style="margin:0">0.10 = +10%. Пример: бутик 3000 € → Украина 3300 €.</p></div>
   <div class="card pad" style="display:flex;flex-direction:column;gap:14px"><h2 style="margin:0;font-size:16px">Очки от поставщиков</h2>
     <label class="f">Порог большой скидки поставщика ${n("cThr", config.eyewear.bigDiscountThreshold)}</label>
     <label class="f">Граница цены бутика, € ${n("cCap", config.eyewear.capBoutique, "1")}</label>
     <label class="f">Надбавка до границы, € ${n("cFlat", config.eyewear.flatAdd, "1")}</label>
     <label class="f">Надбавка выше границы ${n("cPct", config.eyewear.pctAdd)}</label>
     <label class="f">Скидка клиенту (правило Б) ${n("cDisc", config.eyewear.clientDiscount)}</label>
     <div class="row"><label class="f" style="flex:1">Правило В: наценка ${n("cSm", config.eyewear.smallMarkup)}</label><label class="f" style="flex:1">множитель ${n("cSf", config.eyewear.smallFactor)}</label></div></div>
  </div>
  <div class="row" style="margin:18px 0"><button class="btn ghost" id="cPrev">Посмотреть расчёты</button><button class="btn" id="cSave" disabled>Сохранить правила</button></div>
  <div id="cOut"></div>`;
  const read = () => ({ rounding: $("#cRound").value, official: { markup: { ua: +$("#cUa").value, eu: +$("#cEu").value, dxb: +$("#cDxb").value } },
    eyewear: { bigDiscountThreshold: +$("#cThr").value, capBoutique: +$("#cCap").value, flatAdd: +$("#cFlat").value, pctAdd: +$("#cPct").value, clientDiscount: +$("#cDisc").value, smallMarkup: +$("#cSm").value, smallFactor: +$("#cSf").value } });
  $("#main").oninput = e => { if (e.target.closest(".card")) { previewed = false; $("#cSave").disabled = true; } };
  $("#cPrev").onclick = async () => {
    const { results, changes } = await api("pricingPreview", { method: "POST", body: { config: read() } });
    const KIND = { official: "Сайт бренда", "eyewear-supplier": "Очки" }, DEST = { ua: "Украина", eu: "Европа", dxb: "Дубай" };
    $("#cOut").innerHTML = `<div class="card tw"><table><thead><tr><th>Пример</th><th>Бутик</th><th>Закупка</th><th>Правило</th><th>Итог</th><th>Замечания</th></tr></thead><tbody>
      ${results.map(r => `<tr><td>${esc(KIND[r.input.kind] || r.input.kind)}${r.input.dest ? " · " + DEST[r.input.dest] : ""}</td><td class="num">${eur(r.input.boutique)}</td><td class="num">${eur(r.input.purchase)}</td><td>${esc(r.rule || "—")}</td>
      <td class="num"><b>${eur(r.final)}</b></td><td>${r.reasons.map(x => `<span class="pill ${r.blocked ? "err" : "warn"}">${esc(x)}</span>`).join(" ")}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="sec"><h2>Изменятся цены на витрине: ${changes.length}</h2>
      ${changes.length ? `<div class="card tw"><table><thead><tr><th>Товар</th><th>Было</th><th>Станет</th></tr></thead><tbody>${changes.map(c => `<tr><td>${esc(c.brand)} · ${esc(c.title)}</td><td class="num">${eur(c.before)}</td><td class="num">${eur(c.after)}</td></tr>`).join("")}</tbody></table></div>` : ""}</div>`;
    previewed = true; $("#cSave").disabled = false;
  };
  $("#cSave").onclick = async () => {
    if (!previewed) return;
    try { const r = await api("pricingSave", { method: "POST", body: { config: read(), confirmPreview: true } }); toast("Сохранено, пересчитано товаров: " + r.updated); } catch (e) { toast(e.message); }
  };
}

/* ---------- Источники (настройки) ---------- */
async function vSources() {
  const src = (await getSources(true)).filter(s => s.connected && s.adapter !== "file");
  $("#main").innerHTML = head("Источники", "Разрешение на фото, расписание обновления цен и наличия") +
    `<div class="brands" style="grid-template-columns:repeat(auto-fill,minmax(360px,1fr))">${src.map(s => {
      const ck = s.check ? CHECK[s.check.state] : null;
      return `<article class="card pad" data-id="${esc(s.id)}" style="display:flex;flex-direction:column;gap:14px">
      <div class="row"><div><div class="wm" style="font-size:17px">${esc(s.name)}</div><div class="hint">${esc(REGION[s.region] || s.region || "")} · ${esc(s.currency || "")} · ${s.stats.published} на витрине</div></div><span class="sp"></span>${ck ? `<span class="pill ${ck[1]}"><span class="dot"></span>${ck[0]}</span>` : ""}</div>
      ${s.check ? `<div class="hint">Проверка ${dt(s.check.at)}: ${esc(s.check.text)}</div>` : ""}
      <label class="toggle"><input type="checkbox" data-f="copy" ${s.photoCopy.allowed ? "checked" : ""}>Копирование фото разрешено</label>
      <label class="f">Основание — кто и когда разрешил<input type="text" data-f="basis" value="${esc(s.photoCopy.basis || "")}" placeholder="Например: письмо бренда, 29.09.2026"></label>
      <div class="hint">Сейчас: ${s.imageRights === "copy-allowed" ? "фото сохраняются в наше хранилище" : "фото показываются по ссылке с сайта бренда"}</div>
      <label class="f">Обновление цен и наличия<select data-f="schedule">${["off", "daily", "weekly"].map(v => `<option value="${v}" ${s.schedule === v ? "selected" : ""}>${{ off: "Выключено", daily: "Каждый день", weekly: "Раз в неделю" }[v]}</option>`).join("")}</select></label>
      <label class="toggle"><input type="checkbox" data-f="autoUpdate" ${s.autoUpdate ? "checked" : ""}>Применять новые цены и наличие сразу</label>
      <label class="toggle"><input type="checkbox" data-f="autoPublish" ${s.autoPublish ? "checked" : ""}>Публиковать новинки без проверки</label>
      ${s.adapter === "brand-site" ? `<details><summary class="hint" style="cursor:pointer">Карта сайта (для «весь каталог»)</summary><textarea data-f="sitemaps" style="min-height:70px;margin-top:8px">${esc(s.sitemaps.join("\n"))}</textarea></details>` : ""}
      <details><summary class="hint" style="cursor:pointer">Что проверено</summary><ul class="hint" style="padding-left:18px">${s.checks.map(c => `<li>${esc(c)}</li>`).join("")}</ul></details>
      <div class="row"><button class="btn sm" data-save>Сохранить</button><button class="btn ghost sm" data-check="${esc(s.id)}">Проверить доступ</button></div>
    </article>`; }).join("")}</div>`;
  $("#main").onclick = async e => {
    if (e.target.closest("[data-check]")) return homeClick(e);
    const b = e.target.closest("[data-save]"); if (!b) return;
    const card = b.closest("[data-id]"), f = k => card.querySelector(`[data-f=${k}]`);
    try {
      await api("sourceSave", { method: "POST", body: { id: card.dataset.id, photoCopy: { allowed: f("copy").checked, basis: f("basis").value }, schedule: f("schedule").value, autoUpdate: f("autoUpdate").checked, autoPublish: f("autoPublish").checked, ...(f("sitemaps") ? { sitemaps: f("sitemaps").value.split(/\s+/).filter(Boolean) } : {}) } });
      toast("Сохранено"); vSources();
    } catch (err) { toast(err.message); }
  };
}

start();
</script>
</body>
</html>
