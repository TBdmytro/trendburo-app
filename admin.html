const ACT_LABEL = { none: "Без перехода", product: "Товар", brand: "Бренд", category: "Категория", new: "Новинки", service: "Сервис", url: "Ссылка" };
const SVC_LABEL = { concierge: "Консьерж", travel: "Путешествия", resale: "Ресейл", stylist: "ИИ-стилист", optix: "OPTIX" };
let BRANDS_CACHE = null;
async function brandsList() { if (!BRANDS_CACHE) BRANDS_CACHE = (await api("brands", { silent: true })).brands; return BRANDS_CACHE; }
function actionText(a) {
  if (!a || a.type === "none") return "без перехода";
  if (a.type === "category") return "категория «" + (CATS[a.value] || a.value) + "»";
  if (a.type === "service") return "сервис «" + (SVC_LABEL[a.value] || a.value) + "»";
  if (a.type === "brand") return "бренд " + a.value;
  if (a.type === "product") return "товар";
  if (a.type === "new") return "новинки";
  return "ссылка";
}
/** Выбор, куда ведёт баннер / слайд / новость. */
function actionFieldHTML(key, a = { type: "none", value: "" }) {
  return `<div class="actf" data-actf="${key}" data-type="${esc(a.type || "none")}" data-value="${esc(a.value || "")}">
    <label class="f">По нажатию открыть<select data-acttype>${Object.entries(ACT_LABEL).map(([k, v]) => `<option value="${k}" ${k === (a.type || "none") ? "selected" : ""}>${v}</option>`).join("")}</select></label>
    <div class="actf-v"></div></div>`;
}
async function actionFieldInit(root) {
  for (const box of root.querySelectorAll("[data-actf]")) await actionFieldDraw(box);
}
async function actionFieldDraw(box) {
  const type = box.dataset.type, value = box.dataset.value, v = box.querySelector(".actf-v");
  if (type === "category") v.innerHTML = `<select data-actval>${Object.entries(CATS).map(([k, n]) => `<option value="${k}" ${k === value ? "selected" : ""}>${n}</option>`).join("")}</select>`;
  else if (type === "service") v.innerHTML = `<select data-actval>${Object.entries(SVC_LABEL).map(([k, n]) => `<option value="${k}" ${k === value ? "selected" : ""}>${n}</option>`).join("")}</select>`;
  else if (type === "brand") { const bs = await brandsList(); v.innerHTML = bs.length ? `<select data-actval>${bs.map(b => `<option ${b === value ? "selected" : ""}>${esc(b)}</option>`).join("")}</select>` : `<input type="text" data-actval value="${esc(value)}" placeholder="Название бренда">`; }
  else if (type === "url") v.innerHTML = `<input type="text" data-actval value="${esc(value)}" placeholder="https://…">`;
  else if (type === "product") {
    let cur = null; if (value) { try { cur = (await api("productPick", { query: { ids: value }, silent: true })).products[0]; } catch {} }
    v.innerHTML = `<div class="ppick" data-ppick>${cur ? pickChip(cur) : ""}<input type="search" data-pq placeholder="Найти товар: бренд или название"><div class="ppick-res"></div></div>`;
  } else v.innerHTML = "";
  if (["category", "service", "brand"].includes(type) && !value) { const s = v.querySelector("[data-actval]"); if (s) box.dataset.value = s.value; }
}
const pickChip = p => `<div class="pchip" data-pid="${esc(p._id)}">${p.cover ? `<img src="${esc(p.cover)}" alt="">` : ""}<span><b>${esc(p.brand)}</b> ${esc(p.title)}${p.price ? ` · ${eur(p.price)}` : ""}${p.status !== "published" ? " · не на витрине" : ""}</span><button type="button" data-unpick aria-label="Убрать">×</button></div>`;
function actionFieldBind(root) {
  root.addEventListener("change", e => {
    const box = e.target.closest("[data-actf]"); if (!box) return;
    if (e.target.matches("[data-acttype]")) { box.dataset.type = e.target.value; box.dataset.value = ""; actionFieldDraw(box); }
    if (e.target.matches("[data-actval]")) box.dataset.value = e.target.value.trim();
  });
  root.addEventListener("input", e => {
    const box = e.target.closest("[data-actf]");
    if (box && e.target.matches("[data-actval]")) box.dataset.value = e.target.value.trim();
    if (e.target.matches("[data-pq]")) productSearch(e.target);
  });
  root.addEventListener("click", e => {
    const r = e.target.closest("[data-pickres]");
    if (r) {
      const pp = r.closest("[data-ppick]"), p = JSON.parse(r.dataset.pickres);
      const box = r.closest("[data-actf]");
      if (box) { box.dataset.value = p._id; pp.querySelectorAll(".pchip").forEach(x => x.remove()); pp.insertAdjacentHTML("afterbegin", pickChip(p)); }
      else if (pp.dataset.multi !== undefined) { if (!pp.querySelector(`.pchip[data-pid="${CSS.escape(p._id)}"]`)) pp.querySelector(".pchips").insertAdjacentHTML("beforeend", pickChip(p)); }
      pp.querySelector("[data-pq]").value = ""; pp.querySelector(".ppick-res").innerHTML = ""; return;
    }
    const u = e.target.closest("[data-unpick]");
    if (u) { const box = u.closest("[data-actf]"); if (box) box.dataset.value = ""; u.closest(".pchip").remove(); }
  });
}
let pqT;
function productSearch(inp) {
  clearTimeout(pqT); const res = inp.parentElement.querySelector(".ppick-res");
  const q = inp.value.trim(); if (!q) { res.innerHTML = ""; return; }
  pqT = setTimeout(async () => {
    const { products } = await api("productPick", { query: { q }, silent: true });
    res.innerHTML = products.slice(0, 8).map(p => `<button type="button" class="pres" data-pickres='${esc(JSON.stringify(p))}'>${p.cover ? `<img src="${esc(p.cover)}" alt="">` : "<i></i>"}<span><b>${esc(p.brand)}</b> ${esc(p.title)}<small>${p.price ? eur(p.price) : ""}${p.status !== "published" ? " · не на витрине" : ""}</small></span></button>`).join("") || `<div class="hint" style="padding:8px">Ничего не нашли</div>`;
  }, 250);
}
function actionFieldValue(root, key) { const b = root.querySelector(`[data-actf="${key}"]`); return b ? { type: b.dataset.type, value: b.dataset.value || "" } : { type: "none", value: "" }; }

/** Панель редактора: справа на компьютере, во весь экран на телефоне. */
function sheet(title, bodyHTML, footHTML) {
  const d = document.createElement("div"); d.className = "drawer sheet";
  d.innerHTML = `<div class="in" role="dialog" aria-label="${esc(title)}"><div class="sh-h"><button class="btn soft sm" data-x aria-label="Закрыть">✕</button><b>${esc(title)}</b></div><div class="sh-b">${bodyHTML}</div>${footHTML ? `<div class="sh-f">${footHTML}</div>` : ""}</div>`;
  document.body.append(d); tgBack.push(() => d.remove());
  d.addEventListener("click", e => { if (e.target === d || e.target.closest("[data-x]")) close(); });
  const close = () => { d.remove(); tgBack.pop(); };
  d.close = close; return d;
}

const SHOW_TABS = [["banner", "Баннеры"], ["story", "Сторис"], ["news", "Новости"], ["rail", "Подборки"], ["site", "Настройки"]];

    <div class="card list cms-list">${items.map((x, i) => `<div class="li cms-li ${sel.has(x._id) ? "sel" : ""}" data-open="${esc(x._id)}">
      <label class="ck2 static" data-noop><input type="checkbox" data-csel="${esc(x._id)}" ${sel.has(x._id) ? "checked" : ""} aria-label="Выбрать"></label>

      || `<div class="empty"><b>Пока пусто</b>Нажмите «Добавить ${KIND_ONE[kind]}»${kind === "story" ? ". Пока своих сторис нет, на витрине показываются кружки брендов." : ""}</div>`}</div>`;

    b.innerHTML = `<span class="num" style="font-weight:600">Выбрано ${n}</span><button class="btn soft sm" data-bon>Показать</button><button class="btn soft sm" data-boff>Скрыть</button><button class="btn danger sm" data-bdel>Удалить</button><button class="btn soft sm" data-bclr>✕</button>`;
    b.onclick = async e => {

async function loadBitmap(file) {
  try { return await createImageBitmap(file); }
  catch { const im = new Image(); im.src = URL.createObjectURL(file); await im.decode(); return im; }
}
async function cropToB64(file, box) {
  const src = await loadBitmap(file); const W = src.width || src.naturalWidth, H = src.height || src.naturalHeight;
  let [y0, x0, y1, x1] = box.map(v => v / 1000); const py = (y1 - y0) * 0.03, px = (x1 - x0) * 0.03;
  y0 = Math.max(0, y0 - py); x0 = Math.max(0, x0 - px); y1 = Math.min(1, y1 + py); x1 = Math.min(1, x1 + px);
  const sw = (x1 - x0) * W, sh = (y1 - y0) * H, k = Math.min(1, 1600 / Math.max(sw, sh));
  const c = document.createElement("canvas"); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(src, x0 * W, y0 * H, sw, sh, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(b => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.readAsDataURL(b); }, "image/jpeg", 0.88));
}

let undoT = 0;
function undoToast(text, commit, revert) {
  document.querySelector(".undo")?.dispatchEvent(new Event("flush"));
  const u = document.createElement("div"); u.className = "undo"; u.setAttribute("role", "status");
  u.innerHTML = `<span>${esc(text)}</span><button>Отменить</button>`; document.body.append(u);
  let done = false;
  const fin = async ok => { if (done) return; done = true; clearTimeout(undoT); u.remove(); if (ok) { try { await commit(); } catch (e) { toast(e.message); revert && revert(); } } else revert && revert(); };
  u.querySelector("button").onclick = () => fin(false);
  u.addEventListener("flush", () => fin(true));
  undoT = setTimeout(() => fin(true), 7000);
}

    <div class="plist" id="plist"></div><div class="more" id="pmore"></div><div class="pbar" id="pbar"></div>`;
  const q = extra => ({ q: F.q, status: F.status, source: F.source, brand: F.brand, cat: F.cat, ...extra });
  const chipSel = (key, label, arr, labf = x => x) => `<span class="fchip ${F[key] ? "on" : ""}">${esc(F[key] ? labf(F[key]) : label)} ${F[key] ? "×" : "▾"}<select data-f="${key}" aria-label="${label}"><option value="">${label}: все</option>${arr.map(x => `<option value="${esc(x.k)}" ${x.k === F[key] ? "selected" : ""}>${esc(labf(x.k))} · ${x.n}</option>`).join("")}</select></span>`;
  const drawFilters = () => {
    $("#pf").innerHTML = [["", "Все"], ["published", "На витрине"], ["draft", "Скрытые"]].map(([k, v]) => `<button class="fchip ${F.status === k ? "on" : ""}" data-st="${k}">${v}</button>`).join("")
      + chipSel("source", "Поставщик", facets.sources, sname) + chipSel("brand", "Бренд", facets.brands) + chipSel("cat", "Категория", facets.cats, k => CATS[k] || k);
  };
  const row = p => `<div class="prow" data-open="${esc(p._id)}">
      <input type="checkbox" class="ck" data-psel="${esc(p._id)}" ${sel.has(p._id) ? "checked" : ""} aria-label="Выбрать">
      <div class="th">${p.cover ? `<img src="${esc(thumb(p.cover))}" alt="" loading="lazy" decoding="async">` : svg("img")}</div>
      <div class="tx"><span class="br">${esc(p.brand || "—")} · ${esc(sname(p.source || "manual"))}</span><span class="tt">${esc(p.title)}</span>
        <span class="pr"><b class="num">${p.price?.ua ? eur(p.price.ua) : "нет цены"}</b> <span>· ${esc(CATS[p.category] || "—")}${p.avail === false ? " · нет в наличии" : ""}</span></span></div>
      <input type="checkbox" class="sw" data-show1="${esc(p._id)}" ${p.status === "published" ? "checked" : ""} ${p.price?.ua ? "" : "disabled"} aria-label="На витрине"></div>`;
  const bar = () => {
    const n = sel.size;
    $("#pbar").innerHTML = n ? `<span>Выбрано ${n}</span><button class="w" data-bulk="published">Показать</button><button class="g" data-bulk="draft">Скрыть</button><button class="g" data-bulk="del">Удалить</button><button class="g" data-bulk="clr" aria-label="Снять выбор">✕</button>`
      : `<span>Найдено ${total}</span><button class="w" data-all="on">Показать все</button><button class="g" data-all="off">Скрыть все</button>`;
    $("#pbar").hidden = !total;
  };
  const draw = () => {
    $("#plist").innerHTML = list.map(row).join("") || `<div class="empty"><b>Ничего не найдено</b>Измените фильтры, подключите поставщика или добавьте товар со скриншотов</div>`;
    $("#pmore").innerHTML = total > list.length ? `<button class="btn ghost" id="pMore">Показать ещё · ${total - list.length}</button>` : "";
    bar();
  };
  const tot = () => { $("#ptot").textContent = `${total} ${plural(total, ["товар", "товара", "товаров"])} · на витрине ${shown}`; };
  const load = async append => {
    const r = await api("products", { query: q({ offset: append ? list.length : 0 }) });
    list = append ? list.concat(r.products) : r.products; total = r.total; shown = r.shown; facets = r.facets;
    tot(); drawFilters(); draw();
  };
  let t; $("#pq").oninput = e => { F.q = e.target.value; clearTimeout(t); t = setTimeout(load, 300); };
  $("#main").onchange = e => { const f = e.target.dataset.f; if (f) { F[f] = e.target.value; if (f === "source") { F.brand = ""; F.cat = ""; } load(); } };
  $("#main").onclick = async e => {
    if (e.target.closest("select")) return;
    const g = e.target.closest("[data-go]"); if (g) return go(g.dataset.go);
    const chip = e.target.closest(".fchip.on"); if (chip && chip.querySelector("select")) { const k = chip.querySelector("select").dataset.f; F[k] = ""; return load(); }
    const s = e.target.closest("[data-st]"); if (s) { F.status = s.dataset.st; return load(); }
    if (e.target.id === "pMore") return load(true);
    const sw = e.target.closest("[data-show1]");
    if (sw) { const on = sw.checked; try { await api("status", { method: "POST", body: { ids: [sw.dataset.show1], status: on ? "published" : "draft" }, silent: true }); } catch (err) { sw.checked = !on; return toast(err.message); } const p = list.find(x => x._id === sw.dataset.show1); if (p) p.status = on ? "published" : "draft"; shown += on ? 1 : -1; tot(); return toast(on ? "На витрине через ~10 секунд" : "Скрыто с витрины"); }
    const ck = e.target.closest("[data-psel]"); if (ck) { ck.checked ? sel.add(ck.dataset.psel) : sel.delete(ck.dataset.psel); return bar(); }
    const all = e.target.closest("[data-all]");
    if (all) {
      const on = all.dataset.all === "on"; const { ids } = await api("productIds", { query: q() }); if (!ids.length) return toast("Нет товаров по фильтру");
      if (!(await confirmBox(`${on ? "Показать" : "Скрыть"} ${ids.length} ${plural(ids.length, ["товар", "товара", "товаров"])}?`, on ? "Все найденные товары появятся на витрине через ~10 секунд. Товары без цены останутся скрытыми." : "Все найденные товары исчезнут с витрины. Вернуть можно в любой момент.", on ? "Показать" : "Скрыть"))) return;
      await api("status", { method: "POST", body: { ids, status: on ? "published" : "draft" } }); toast((on ? "На витрине: " : "Скрыто: ") + ids.length); return load();
    }
    const bk = e.target.closest("[data-bulk]");
    if (bk) {
      const ids = [...sel], k = bk.dataset.bulk;
      if (k === "clr") { sel.clear(); return draw(); }
      if (k === "del") { if (!(await confirmBox(`Удалить ${ids.length} ${plural(ids.length, ["товар", "товара", "товаров"])}?`, "Товары исчезнут из админки и с витрины. Товары поставщика вернутся при следующем обновлении каталога — чтобы не показывать, лучше «Скрыть»."))) return; await api("productDelete", { method: "POST", body: { ids } }); toast("Удалено: " + ids.length); }
      else { await api("status", { method: "POST", body: { ids, status: k } }); toast((k === "published" ? "На витрине: " : "Скрыто: ") + ids.length); }
      sel.clear(); return load();
    }
    const r = e.target.closest("[data-open]"); if (r) editor(r.dataset.open, () => load());
  };
  await load();
}

/* ---------- Заказы ---------- */
const ORD_FLOW = ["new", "work", "paid", "bought", "shipping", "delivered"];
const ORD_ST = { new: "Новая", work: "Принят", paid: "Оплачен", bought: "Выкуплен", shipping: "В пути", delivered: "Доставлен", cancelled: "Отменён" };
const ORD_NEXT = { new: "Принять заказ", work: "Отметить «Оплачен»", paid: "Отметить «Выкуплен»", bought: "Отправить — «В пути»", shipping: "Отметить «Доставлен»" };
async function vOrders(st) {
  const status = ORD_ST[st] ? st : "";
  const { leads, fresh } = await api("leads", { query: status ? { status } : {} });
  updateLeadBadge(fresh);
  $("#main").innerHTML = `<div class="vh"><h1>Заказы</h1><a class="btn soft sm" href="#finance">${svg("finance")}Финансы</a></div><p class="vsub">Заказы и вопросы из приложения. Меняете этап — клиент получает сообщение от бота.</p>
    <div class="fchips"><button class="fchip ${!status ? "on" : ""}" data-lst="">Все</button>${Object.entries(ORD_ST).map(([k, v]) => `<button class="fchip ${status === k ? "on" : ""}" data-lst="${k}">${v}${k === "new" && fresh ? " · " + fresh : ""}</button>`).join("")}</div>
    <div>${leads.map(l => `<div class="orow" data-lead="${esc(l._id)}"><div class="tx"><b>${esc(LEAD_KIND[l.kind] || "Заявка")} ${esc(l.number)}${l.total ? " · " + eur(l.total) : ""}</b>
      <span>${dt(l.createdAt)} · ${esc(l.tg?.username ? "@" + l.tg.username : l.tg?.name || "клиент")}${l.items?.length ? " · " + esc(l.items.map(i => i.title).slice(0, 2).join(", ")) : ""}</span></div><span class="st ${l.status}">${ORD_ST[l.status] || l.status}</span></div>`).join("")
      || `<div class="empty"><b>Пусто</b>${status ? "С этим статусом заказов нет" : "Когда клиент оформит заказ или задаст вопрос в приложении, он появится здесь"}</div>`}</div>`;
  $("#main").onclick = e => {
    const f = e.target.closest("[data-lst]"); if (f) return go("leads" + (f.dataset.lst ? ":" + f.dataset.lst : ""));
    const r = e.target.closest("[data-lead]"); if (r) orderSheet(leads.find(l => l._id === r.dataset.lead), () => vOrders(status));
  };
}
function orderSheet(l, reload) {
  const i = ORD_FLOW.indexOf(l.status), next = i >= 0 && i < ORD_FLOW.length - 1 ? ORD_FLOW[i + 1] : null;
  const who = l.tg?.username ? "@" + l.tg.username : l.tg?.name || "Клиент";
  const d = sheet(`${LEAD_KIND[l.kind] || "Заявка"} ${l.number}`, `<div class="form">
    <div class="hint">${dt(l.createdAt)}${l.manager ? " · ведёт " + esc(l.manager) : ""}</div>
    ${l.status === "cancelled" ? `<div class="note-box err">${svg("warn")}<div>Заказ отменён</div></div>` : `<div><div class="stages">${ORD_FLOW.slice(1).map((s, k) => `<i class="${k + 1 <= i ? "on" : ""}"></i>`).join("")}</div><div class="stlab">${ORD_FLOW.slice(1).map(s => s === l.status ? `<b>${ORD_ST[s]}</b>` : `<span>${ORD_ST[s]}</span>`).join("")}</div></div>`}
    <div class="client"><span class="av">${esc((who.replace("@", "")[0] || "?").toUpperCase())}</span><div class="tx"><b>${esc(who)}</b><span>${l.dest ? { ua: "доставка в Украину", eu: "доставка по Европе", dxb: "доставка в Дубай" }[l.dest] : "доставка не указана"}${l.contact ? " · " + esc(l.contact) : ""}</span></div>
      ${l.tg?.username ? `<a href="https://t.me/${esc(l.tg.username)}" target="_blank" rel="noopener" aria-label="Написать в Telegram"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H9l-5 4z"/></svg></a>` : ""}</div>
    ${l.items?.length ? `<div>${l.items.map(it => `<div class="oitem"><div class="tx"><b>${esc(it.brand)} ${esc(it.title)}</b><span>${[it.size && "размер " + it.size, it.color].filter(Boolean).map(esc).join(" · ") || "&nbsp;"}</span></div><b class="num">${it.price ? eur(it.price) : ""}</b></div>`).join("")}
      ${l.total ? `<div class="oitem"><div class="tx"><b>Итого</b></div><b class="num">${eur(l.total)}</b></div>` : ""}</div>` : ""}
    <details><summary class="hint" style="cursor:pointer">Сообщение клиента</summary><pre class="msg" style="margin-top:8px">${esc(l.message || "—")}</pre></details>
    <label class="f">Трек-номер<input type="text" id="oTrack" value="${esc(l.track || "")}" placeholder="появится у клиента на этапе «В пути»"></label>
    <label class="f">Заметка для себя<textarea id="oNote" style="min-height:70px">${esc(l.note || "")}</textarea></label>
    <label class="toggle"><input type="checkbox" id="oNotify" ${l.tg?.id ? "checked" : "disabled"}>${l.tg?.id ? "Сообщать клиенту в Telegram при смене этапа" : "Клиент без Telegram — бот не сможет написать"}</label>
    <div><div class="f" style="margin-bottom:8px">Изменить этап вручную</div><div class="fchips" style="flex-wrap:wrap">${Object.entries(ORD_ST).map(([k, v]) => `<button type="button" class="fchip ${l.status === k ? "on" : ""}" data-setst="${k}">${v}</button>`).join("")}</div></div>
    <button type="button" class="btn danger sm" data-odel style="align-self:flex-start">Удалить заявку</button></div>`,
    `${next ? `<button class="btn lg" data-next="${next}">${ORD_NEXT[l.status]}</button>` : ""}<button class="btn ${next ? "ghost" : ""} lg" data-osave>Сохранить</button>`);
  const send = async status => {
    try {
      const r = await api("leadSave", { method: "POST", body: { id: l._id, status, note: d.querySelector("#oNote").value, track: d.querySelector("#oTrack").value, notify: d.querySelector("#oNotify").checked } });
      toast(status && status !== l.status ? `${ORD_ST[status]}${r.lead.clientNotified ? " · клиенту отправлено сообщение" : ""}` : "Сохранено"); d.close(); reload();
    } catch (err) { toast(err.message); }
  };
  d.querySelector(".sh-b").onclick = async e => {
    const s = e.target.closest("[data-setst]"); if (s) return send(s.dataset.setst);
    if (e.target.closest("[data-odel]")) {
      if (!(await confirmBox("Удалить заявку?", "Клиент перестанет видеть её статус в «Кабинете»."))) return;
      await api("leadDelete", { method: "POST", body: { ids: [l._id] } }); d.close(); reload();
    }
  };
  d.querySelector(".sh-f").onclick = e => { const b = e.target.closest("button"); if (!b) return; send(b.dataset.next || undefined); };
}

/* ---------- Финансы ---------- */
async function vFinance(period) {
  const per = ["week", "month", "quarter", "year"].includes(period) ? period : "month";
  const f = await api("finance", { query: { period: per } });
  const max = Math.max(1, ...f.series), bmax = Math.max(1, ...f.brands.map(b => b.total));
  $("#main").innerHTML = `<div class="vh"><h1>Финансы</h1><button class="btn soft sm" id="finCsv">Выгрузить CSV</button></div>
    <div class="seg" style="margin:10px 0 14px">${[["week", "Неделя"], ["month", "Месяц"], ["quarter", "Квартал"], ["year", "Год"]].map(([k, v]) => `<button data-per="${k}" aria-pressed="${k === per}">${v}</button>`).join("")}</div>
    <div class="fin"><span>Выручка · оплаченные заказы</span><b class="num">${eur(f.revenue)}</b><span>маржа ≈ ${eur(f.margin)} · ${f.orders} ${plural(f.orders, ["заказ", "заказа", "заказов"])} · средний чек ${eur(f.avg)}</span>
      <div class="bars">${f.series.map(v => `<i style="height:${Math.round(v / max * 100)}%" title="${eur(v)}"></i>`).join("")}</div></div>
    <p class="hint">Маржа считается по вашим правилам цен (наценка Украина / Европа / Дубай), без учёта доставки и комиссий.</p>
    <div class="h2">Деньги в пути</div>
    <div class="kvs"><div><span>Ждут оплаты клиентом</span><b class="num">${eur(f.pipeline.awaiting)}</b></div><div><span>Оплачено, ещё не выкуплено</span><b class="num">${eur(f.pipeline.paid)}</b></div><div><span>Выкуплено, в пути к клиенту</span><b class="num">${eur(f.pipeline.moving)}</b></div></div>
    <div class="h2">По брендам</div>
    ${f.brands.length ? f.brands.map(b => `<div class="brandbar"><div><span>${esc(b.brand)}</span><b class="num">${eur(b.total)}</b></div><i style="width:${Math.max(3, Math.round(b.total / bmax * 100))}%"></i></div>`).join("") : `<p class="hint">Появится, когда будут оплаченные заказы.</p>`}`;
  $("#main").onclick = async e => {
    const p = e.target.closest("[data-per]"); if (p) return go("finance:" + p.dataset.per);
    if (e.target.closest("#finCsv")) {
      const { leads } = await api("leads");
      const rows = [["Номер", "Дата", "Тип", "Статус", "Клиент", "Доставка", "Сумма €", "Товары"]].concat(leads.map(l => [l.number, new Date(l.createdAt).toLocaleDateString("ru-RU"), LEAD_KIND[l.kind] || l.kind, ORD_ST[l.status] || l.status, l.tg?.username ? "@" + l.tg.username : l.tg?.name || "", l.dest || "", l.total || "", (l.items || []).map(i => i.brand + " " + i.title).join("; ")]));
      const csv = "﻿" + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(";")).join("\n");
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = "trendburo-zakazy.csv"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
  };
}

/* ---------- Баннер: живой предпросмотр в редакторе ---------- */
function bannerPreview(root) {
  const box = document.createElement("div"); box.className = "bnpv"; box.innerHTML = `<small>Так увидит клиент</small><div class="bn" id="bnPv"></div>`;
  root.prepend(box);
  const upd = () => {
    const v = k => root.querySelector(`[data-k="${k}"]`)?.value || "";
    const img = root.querySelector('[data-imgf="image"]')?.dataset.url || "";
    const light = root.querySelector('[data-seg="theme"] [aria-pressed="true"]')?.dataset.v === "light";
    const pv = box.querySelector("#bnPv"); pv.className = "bn" + (light ? " light" : "");
    pv.innerHTML = `${img ? `<img src="${esc(img)}" alt="">` : ""}<span class="ov"></span><span class="tx">${v("title") ? `<b>${esc(v("title"))}</b>` : ""}${v("subtitle") ? `<span>${esc(v("subtitle"))}</span>` : ""}${v("button") ? `<span class="go">${esc(v("button"))}</span>` : ""}</span>`;
  };
  root.addEventListener("input", upd); root.addEventListener("click", () => setTimeout(upd, 0));
  new MutationObserver(upd).observe(root, { attributes: true, subtree: true, attributeFilter: ["data-url"] });
  upd();
}

start();
</script>
