  };
}

/* =====================================================================
   Общие инструменты: фото, выбор действия, всплывающая панель редактора
   ===================================================================== */
function fileToJpegB64(file, max = 1600) {
  return new Promise(async (ok, bad) => {
    try {
      const bmp = await createImageBitmap(file).catch(() => null);
      let w, h, src;
      if (bmp) { src = bmp; w = bmp.width; h = bmp.height; }
      else { const im = new Image(); im.src = URL.createObjectURL(file); await im.decode(); src = im; w = im.naturalWidth; h = im.naturalHeight; }
      const k = Math.min(1, max / Math.max(w, h)); const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(src, 0, 0, c.width, c.height);
      c.toBlob(b => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.readAsDataURL(b); }, "image/jpeg", 0.86);
    } catch (e) { bad(new Error("Не удалось прочитать фото: " + file.name)); }
  });
}
async function uploadPhoto(file, max) {
  const data = await fileToJpegB64(file, max);
  return (await api("imageUpload", { method: "POST", body: { data } })).url;
}
function pickFile(multiple = false) {
  return new Promise(res => { const i = document.createElement("input"); i.type = "file"; i.accept = "image/jpeg,image/png,image/webp,image/heic"; i.multiple = multiple; i.onchange = () => res([...i.files]); i.click(); });
}
/** Поле фото: превью + «Загрузить» / «Ссылка» / «Убрать». Значение хранится в data-url у .imgf. */
function imgFieldHTML(key, url, label = "Фото", hint = "") {
  return `<div class="imgf" data-imgf="${key}" data-url="${esc(url || "")}"><div class="f">${esc(label)}${hint ? ` <span class="hint" style="font-weight:400">${esc(hint)}</span>` : ""}</div>
    <div class="imgf-row"><div class="imgf-pv">${url ? `<img src="${esc(url)}" alt="">` : svg("img")}</div>
    <div class="imgf-act"><button class="btn ghost sm" data-imgup="${key}">${url ? "Заменить" : "Загрузить"}</button><button class="btn soft sm" data-imglink="${key}">Ссылка</button>${url ? `<button class="btn soft sm" data-imgrm="${key}">Убрать</button>` : ""}</div></div></div>`;
}
function imgFieldValue(root, key) { return root.querySelector(`[data-imgf="${key}"]`)?.dataset.url || ""; }
async function imgFieldClick(root, e) {
  const t = e.target.closest("[data-imgup],[data-imglink],[data-imgrm]"); if (!t) return false;
  const key = t.dataset.imgup || t.dataset.imglink || t.dataset.imgrm, box = root.querySelector(`[data-imgf="${key}"]`);
  const set = u => { box.dataset.url = u; const pv = box.querySelector(".imgf-pv"); pv.innerHTML = u ? `<img src="${esc(u)}" alt="">` : svg("img");
    box.querySelector(".imgf-act").innerHTML = `<button class="btn ghost sm" data-imgup="${key}">${u ? "Заменить" : "Загрузить"}</button><button class="btn soft sm" data-imglink="${key}">Ссылка</button>${u ? `<button class="btn soft sm" data-imgrm="${key}">Убрать</button>` : ""}`; };
  if (t.dataset.imgrm) { set(""); return true; }
  if (t.dataset.imglink) { const u = prompt("Ссылка на фото (https://…)", box.dataset.url || ""); if (u !== null) { if (u && !/^https:\/\//.test(u.trim())) toast("Нужна ссылка https://…"); else set(u.trim()); } return true; }
  const [f] = await pickFile(); if (!f) return true;
  box.querySelector(".imgf-pv").innerHTML = '<span class="spin"></span>';
  try { set(await uploadPhoto(f, key === "image" ? 2000 : 1600)); } catch (err) { toast(err.message); set(box.dataset.url); }
  return true;
}

const ACT_LABEL = { none: "Без перехода", product: "Товар", brand: "Бренд", category: "Категория", new: "Новинки", service: "Сервис", url: "Ссылка" };
const SVC_LABEL = { concierge: "Консьерж", travel: "Путешествия", resale: "Ресейл", stylist: "ИИ-стилист", optix: "OPTIX" };
let BRANDS_CACHE = null;
async function brandsList() { if (!BRANDS_CACHE) BRANDS_CACHE = (await api("brands", { silent: true })).brands; return BRANDS_CACHE; }
function actionText(a) {
  if (!a || a.type === "none") return "без перехода";
  if (a.type === "category") return "категория «" + (CATS[a.value] || a.value) + "»";
  if (a.type === "service") return "сервис «" + (SVC_LABEL[a.value] || a.value) + "»";
  if (a.type === "brand") return "бренд " + a.value;
  if (a.type === "product") return "товар";
  if (a.type === "new") return "новинки";
  return "ссылка";
}
/** Выбор, куда ведёт баннер / слайд / новость. */
function actionFieldHTML(key, a = { type: "none", value: "" }) {
  return `<div class="actf" data-actf="${key}" data-type="${esc(a.type || "none")}" data-value="${esc(a.value || "")}">
    <label class="f">По нажатию открыть<select data-acttype>${Object.entries(ACT_LABEL).map(([k, v]) => `<option value="${k}" ${k === (a.type || "none") ? "selected" : ""}>${v}</option>`).join("")}</select></label>
    <div class="actf-v"></div></div>`;
}
async function actionFieldInit(root) {
  for (const box of root.querySelectorAll("[data-actf]")) await actionFieldDraw(box);
}
async function actionFieldDraw(box) {
  const type = box.dataset.type, value = box.dataset.value, v = box.querySelector(".actf-v");
  if (type === "category") v.innerHTML = `<select data-actval>${Object.entries(CATS).map(([k, n]) => `<option value="${k}" ${k === value ? "selected" : ""}>${n}</option>`).join("")}</select>`;
  else if (type === "service") v.innerHTML = `<select data-actval>${Object.entries(SVC_LABEL).map(([k, n]) => `<option value="${k}" ${k === value ? "selected" : ""}>${n}</option>`).join("")}</select>`;
  else if (type === "brand") { const bs = await brandsList(); v.innerHTML = bs.length ? `<select data-actval>${bs.map(b => `<option ${b === value ? "selected" : ""}>${esc(b)}</option>`).join("")}</select>` : `<input type="text" data-actval value="${esc(value)}" placeholder="Название бренда">`; }
  else if (type === "url") v.innerHTML = `<input type="text" data-actval value="${esc(value)}" placeholder="https://…">`;
  else if (type === "product") {
    let cur = null; if (value) { try { cur = (await api("productPick", { query: { ids: value }, silent: true })).products[0]; } catch {} }
    v.innerHTML = `<div class="ppick" data-ppick>${cur ? pickChip(cur) : ""}<input type="search" data-pq placeholder="Найти товар: бренд или название"><div class="ppick-res"></div></div>`;
  } else v.innerHTML = "";
  if (["category", "service", "brand"].includes(type) && !value) { const s = v.querySelector("[data-actval]"); if (s) box.dataset.value = s.value; }
}
const pickChip = p => `<div class="pchip" data-pid="${esc(p._id)}">${p.cover ? `<img src="${esc(p.cover)}" alt="">` : ""}<span><b>${esc(p.brand)}</b> ${esc(p.title)}${p.price ? ` · ${eur(p.price)}` : ""}${p.status !== "published" ? " · не на витрине" : ""}</span><button type="button" data-unpick aria-label="Убрать">×</button></div>`;
function actionFieldBind(root) {
  root.addEventListener("change", e => {
    const box = e.target.closest("[data-actf]"); if (!box) return;
    if (e.target.matches("[data-acttype]")) { box.dataset.type = e.target.value; box.dataset.value = ""; actionFieldDraw(box); }
    if (e.target.matches("[data-actval]")) box.dataset.value = e.target.value.trim();
  });
  root.addEventListener("input", e => {
    const box = e.target.closest("[data-actf]");
    if (box && e.target.matches("[data-actval]")) box.dataset.value = e.target.value.trim();
    if (e.target.matches("[data-pq]")) productSearch(e.target);
  });
  root.addEventListener("click", e => {
    const r = e.target.closest("[data-pickres]");
    if (r) {
      const pp = r.closest("[data-ppick]"), p = JSON.parse(r.dataset.pickres);
      const box = r.closest("[data-actf]");
      if (box) { box.dataset.value = p._id; pp.querySelectorAll(".pchip").forEach(x => x.remove()); pp.insertAdjacentHTML("afterbegin", pickChip(p)); }
      else if (pp.dataset.multi !== undefined) { if (!pp.querySelector(`.pchip[data-pid="${CSS.escape(p._id)}"]`)) pp.querySelector(".pchips").insertAdjacentHTML("beforeend", pickChip(p)); }
      pp.querySelector("[data-pq]").value = ""; pp.querySelector(".ppick-res").innerHTML = ""; return;
    }
    const u = e.target.closest("[data-unpick]");
    if (u) { const box = u.closest("[data-actf]"); if (box) box.dataset.value = ""; u.closest(".pchip").remove(); }
  });
}
let pqT;
function productSearch(inp) {
  clearTimeout(pqT); const res = inp.parentElement.querySelector(".ppick-res");
  const q = inp.value.trim(); if (!q) { res.innerHTML = ""; return; }
  pqT = setTimeout(async () => {
    const { products } = await api("productPick", { query: { q }, silent: true });
    res.innerHTML = products.slice(0, 8).map(p => `<button type="button" class="pres" data-pickres='${esc(JSON.stringify(p))}'>${p.cover ? `<img src="${esc(p.cover)}" alt="">` : "<i></i>"}<span><b>${esc(p.brand)}</b> ${esc(p.title)}<small>${p.price ? eur(p.price) : ""}${p.status !== "published" ? " · не на витрине" : ""}</small></span></button>`).join("") || `<div class="hint" style="padding:8px">Ничего не нашли</div>`;
  }, 250);
}
function actionFieldValue(root, key) { const b = root.querySelector(`[data-actf="${key}"]`); return b ? { type: b.dataset.type, value: b.dataset.value || "" } : { type: "none", value: "" }; }

/** Панель редактора: справа на компьютере, во весь экран на телефоне. */
function sheet(title, bodyHTML, footHTML) {
  const d = document.createElement("div"); d.className = "drawer sheet";
  d.innerHTML = `<div class="in" role="dialog" aria-label="${esc(title)}"><div class="sh-h"><button class="btn soft sm" data-x aria-label="Закрыть">✕</button><b>${esc(title)}</b></div><div class="sh-b">${bodyHTML}</div>${footHTML ? `<div class="sh-f">${footHTML}</div>` : ""}</div>`;
  document.body.append(d); tgBack.push(() => d.remove());
  d.addEventListener("click", e => { if (e.target === d || e.target.closest("[data-x]")) close(); });
  const close = () => { d.remove(); tgBack.pop(); };
  d.close = close; return d;
}

/* =====================================================================
   Витрина: баннеры, сторис, новости, подборки, настройки
   ===================================================================== */
const SHOW_TABS = [["banner", "Баннеры"], ["story", "Сторис"], ["news", "Новости"], ["rail", "Подборки"], ["site", "Настройки"]];
const KIND_ONE = { banner: "баннер", story: "сторис", news: "новость", rail: "подборку" };
const KIND_HINT = {
  banner: "Большие карточки вверху «Ленты». Листаются пальцем, меняются сами каждые 5 секунд.",
  story: "Кружки под заголовком «Ленты». Внутри — слайды с фото, текстом и кнопкой.",
  news: "Блок «Новости» в «Ленте» и в сторис бренда.",
  rail: "Горизонтальные ленты товаров в «Ленте»: новинки, категория, бренд, «в наличии» или ваш список."
};
async function vShow(sub) {
  const kind = SHOW_TABS.some(t => t[0] === sub) ? sub : "banner";
  const tabs = `<div class="seg" style="margin-bottom:16px;max-width:100%;overflow-x:auto">${SHOW_TABS.map(([k, v]) => `<button data-show="${k}" aria-pressed="${k === kind}">${v}</button>`).join("")}</div>`;
  if (kind === "site") return vSite(tabs);
  let items = (await api("cmsList", { query: { kind } })).items, sel = new Set();
  const meta = x => kind === "banner" ? [x.subtitle, actionText(x.action)].filter(Boolean).join(" · ")
    : kind === "story" ? `${x.slides.length} ${plural(x.slides.length, ["слайд", "слайда", "слайдов"])}`
    : kind === "news" ? [x.tag, dt(x.createdAt)].filter(Boolean).join(" · ")
    : ({ new: "Новинки", category: "Категория: " + (CATS[x.value] || x.value), brand: "Бренд: " + x.value, manual: `Свой список: ${x.ids.length}`, stock: "В наличии" }[x.rule] || "") + (x.gender ? (x.gender === "w" ? " · женское" : " · мужское") : "") + (x.maxPrice ? " · до " + eur(x.maxPrice) : "");
  const thumb = x => kind === "banner" ? x.image : kind === "story" ? x.cover : kind === "news" ? x.image : "";
  const dates = x => x.from || x.to ? `<span class="pill">${x.from ? "с " + x.from.split("-").reverse().join(".") : ""}${x.to ? " до " + x.to.split("-").reverse().join(".") : ""}</span>` : "";
  const draw = () => {
    $("#main").innerHTML = head("Витрина", KIND_HINT[kind], `<a class="btn ghost" href="/" target="_blank" rel="noopener">Открыть витрину</a><button class="btn" data-new>${svg("add")}Добавить ${KIND_ONE[kind]}</button>`) + tabs + `
    <div class="card list cms-list">${items.map((x, i) => `<div class="li cms-li ${sel.has(x._id) ? "sel" : ""}" data-open="${esc(x._id)}">
      <label class="ck2 static" data-noop><input type="checkbox" data-csel="${esc(x._id)}" ${sel.has(x._id) ? "checked" : ""} aria-label="Выбрать"></label>
      ${kind !== "rail" ? `<div class="cms-th ${kind === "story" ? "round" : ""}">${thumb(x) ? `<img src="${esc(thumb(x))}" alt="" loading="lazy">` : svg("img")}</div>` : ""}
      <div class="t"><b>${esc(x.title || "Без заголовка")}</b><span>${esc(meta(x))}</span>${dates(x)}</div>
      <div class="cms-ctl" data-noop><button class="btn soft sm" data-up="${i}" ${i ? "" : "disabled"} aria-label="Выше">↑</button><button class="btn soft sm" data-dn="${i}" ${i < items.length - 1 ? "" : "disabled"} aria-label="Ниже">↓</button>
      <label class="toggle" title="${x.active ? "Показывается" : "Скрыт"}"><input type="checkbox" data-act1="${esc(x._id)}" ${x.active ? "checked" : ""}></label></div></div>`).join("")
      || `<div class="empty"><b>Пока пусто</b>Нажмите «Добавить ${KIND_ONE[kind]}»${kind === "story" ? ". Пока своих сторис нет, на витрине показываются кружки брендов." : ""}</div>`}</div>`;
    bar();
  };
  const bar = () => {
    let b = $(".actbar"); const n = sel.size;
    if (!n) { b?.remove(); return; }
    if (!b) { b = document.createElement("div"); b.className = "actbar"; document.body.append(b); }
    b.innerHTML = `<span class="num" style="font-weight:600">Выбрано ${n}</span><button class="btn soft sm" data-bon>Показать</button><button class="btn soft sm" data-boff>Скрыть</button><button class="btn danger sm" data-bdel>Удалить</button><button class="btn soft sm" data-bclr>✕</button>`;
    b.onclick = async e => {
      const t = e.target.closest("button"); if (!t) return; const ids = [...sel];
      if ("bclr" in t.dataset) { sel.clear(); return draw(); }
      if ("bdel" in t.dataset) { if (!(await confirmBox(`Удалить ${n}?`, "Элементы исчезнут с витрины. Это нельзя отменить."))) return; await api("cmsDelete", { method: "POST", body: { ids } }); toast("Удалено: " + n); }
      else await api("cmsActive", { method: "POST", body: { ids, active: "bon" in t.dataset } });
      sel.clear(); reload();
    };
  };
  const reload = async () => { items = (await api("cmsList", { query: { kind } })).items; draw(); };
  draw();
  $("#main").onclick = async e => {
    const t = e.target.closest("[data-show],[data-new],[data-up],[data-dn],[data-act1],[data-csel],[data-noop],[data-open]"); if (!t || "noop" in t.dataset) return;
    if (t.dataset.show) return go("show:" + t.dataset.show);
    if ("new" in t.dataset) return cmsEditor(kind, null, reload);
    if (t.dataset.up || t.dataset.dn) {
      const i = +(t.dataset.up ?? t.dataset.dn), j = t.dataset.up ? i - 1 : i + 1;
      [items[i], items[j]] = [items[j], items[i]]; draw();
      await api("cmsReorder", { method: "POST", body: { kind, ids: items.map(x => x._id) } }); return;
    }
    if (t.dataset.act1) { await api("cmsActive", { method: "POST", body: { ids: [t.dataset.act1], active: t.checked } }); const x = items.find(y => y._id === t.dataset.act1); if (x) x.active = t.checked; toast(t.checked ? "Показывается на витрине" : "Скрыт с витрины"); return; }
    if (t.dataset.csel) { t.checked ? sel.add(t.dataset.csel) : sel.delete(t.dataset.csel); t.closest(".li").classList.toggle("sel", t.checked); return bar(); }

  };
}

  };
}

  push(fn) { this.stack.push(fn); this.sync(); },
  pop() { this.stack.pop(); this.sync(); },
  sync() { if (!TG) return; const need = this.stack.length || /^(job|add|show|leads):/.test(view); try { need ? TG.BackButton.show() : TG.BackButton.hide(); } catch {} }
};
if (TG) {
  try { TG.ready(); TG.expand(); TG.setHeaderColor && TG.setHeaderColor("#1c1d20"); TG.setBackgroundColor && TG.setBackgroundColor("#f6f6f7"); TG.disableVerticalSwipes && TG.disableVerticalSwipes(); } catch {}
  document.documentElement.classList.add("tg");
  TG.BackButton.onClick(() => { const top = tgBack.stack[tgBack.stack.length - 1]; if (top) { top(); tgBack.stack.pop(); tgBack.sync(); } else history.back(); });
}
function mobileNav() {
  const m = document.createElement("nav"); m.className = "mnav"; m.id = "mnav";
  m.innerHTML = [["home", "Обзор", "home"], ["products", "Товары", "products"], ["add", "Добавить", "add"], ["leads", "Заявки", "leads"], ["more", "Ещё", "more"]]
    .map(([k, v, ic]) => `<button data-m="${k}" class="${k === "add" ? "plus" : ""}">${svg(ic)}<span>${v}</span>${k === "leads" ? '<i class="cnt" id="mLeadCnt" hidden></i>' : ""}</button>`).join("");
  document.body.append(m);
  m.onclick = e => {
    const b = e.target.closest("[data-m]"); if (!b) return;
    if (b.dataset.m !== "more") return go(b.dataset.m);
    const d = sheet("Меню", `<div class="card list">${NAV.filter(([k]) => !["home", "products", "add", "leads"].includes(k)).map(([k, v]) => `<div class="li" data-mgo="${k}">${svg(k)}<div class="t"><b>${v}</b></div><span class="hint">›</span></div>`).join("")}
      <div class="li" data-mgo="logout"><div class="t"><b>Выйти</b><span>${esc(me || "")}</span></div></div></div>`);
    d.querySelector(".sh-b").onclick = e2 => { const r = e2.target.closest("[data-mgo]"); if (!r) return; d.close(); if (r.dataset.mgo === "logout") return $("#logout").click(); go(r.dataset.mgo); };
  };
}
function mobileNavSync() {
  const m = $("#mnav"); if (!m) return; const k = view.split(":")[0];
  const map = { home: "home", products: "products", add: "add", leads: "leads" };
  m.querySelectorAll("[data-m]").forEach(b => b.classList.toggle("on", b.dataset.m === (map[k] || (["show", "load", "jobs", "job", "watch", "prices", "sources"].includes(k) ? "more" : ""))));
  tgBack.sync();
}

start();
</script>
